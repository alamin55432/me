    <script>
        // TODO: আপনার ফায়ারবেস কনসোল থেকে পাওয়া কনফিগারেশন এখানে বসান
       const firebaseConfig = {
  apiKey: "AIzaSyCwxTRS9qV4E_SKNcDbwZhpAbmt9lzTTB0",
  authDomain: "uthan-app.firebaseapp.com",
  databaseURL: "https://uthan-app-default-rtdb.firebaseio.com",
  projectId: "uthan-app",
  storageBucket: "uthan-app.firebasestorage.app",

};

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();


        // ---------- Helpers (security & UX) ----------
        function esc(v){ return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
        function safeUrl(u){
            u = String(u || '');
            if (u.startsWith('data:image/')) return esc(u);
            try { const x = new URL(u); return (x.protocol === 'https:' || x.protocol === 'http:') ? esc(u) : ''; } catch (e) { return ''; }
        }
        async function hashPw(phone, pw){
            if (!window.crypto || !crypto.subtle) return pw;
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('uthan:' + phone + ':' + pw));
            return 'h1$' + Array.from(new Uint8Array(buf)).map(x => x.toString(16).padStart(2, '0')).join('');
        }
        function timeAgo(ts, fallback){
            if (!ts) return fallback || 'এইমাত্র';
            const s = Math.floor((Date.now() - ts) / 1000), bn = n => n.toLocaleString('bn-BD');
            if (s < 60) return 'এইমাত্র';
            if (s < 3600) return bn(Math.floor(s / 60)) + ' মিনিট আগে';
            if (s < 86400) return bn(Math.floor(s / 3600)) + ' ঘণ্টা আগে';
            if (s < 2592000) return bn(Math.floor(s / 86400)) + ' দিন আগে';
            return new Date(ts).toLocaleDateString('bn-BD', { year: 'numeric', month: 'long', day: 'numeric' });
        }
        function banglaDate(d) {
            // Bangladesh revised calendar: 1 Boishakh = 14 April; first six months 31 days, then 30; Falgun 29 (30 in a leap year); Choitro 30
            const y = d.getFullYear(), bn = n => Number(n).toLocaleString('bn-BD', { useGrouping: false });
            let sy = y, by = y - 593;
            if (Date.UTC(y, d.getMonth(), d.getDate()) < Date.UTC(y, 3, 14)) { sy = y - 1; by = y - 594; }
            let off = Math.round((Date.UTC(y, d.getMonth(), d.getDate()) - Date.UTC(sy, 3, 14)) / 864e5);
            const ny = sy + 1, leap = (ny % 4 === 0 && ny % 100 !== 0) || ny % 400 === 0;
            const lens = [31, 31, 31, 31, 31, 31, 30, 30, 30, 30, leap ? 30 : 29, 30];
            const names = ['বৈশাখ', 'জ্যৈষ্ঠ', 'আষাঢ়', 'শ্রাবণ', 'ভাদ্র', 'আশ্বিন', 'কার্তিক', 'অগ্রহায়ণ', 'পৌষ', 'মাঘ', 'ফাল্গুন', 'চৈত্র'];
            let m = 0;
            while (m < 11 && off >= lens[m]) { off -= lens[m]; m++; }
            return bn(off + 1) + ' ' + names[m] + ' ' + bn(by);
        }
        function todayStoryText() {
            const d = new Date();
            const en = d.toLocaleDateString('bn-BD', { day: 'numeric', month: 'long', year: 'numeric' });
            const wd = d.toLocaleDateString('bn-BD', { weekday: 'long' });
            let ar = '';
            try { // Bangladesh usually sights the moon a day after Saudi Arabia, so the Saudi-based date is shifted back one day
                ar = new Date(d.getTime() - 864e5).toLocaleDateString('bn-BD-u-ca-islamic-umalqura', { day: 'numeric', month: 'long', year: 'numeric' }).replace(/\s*(এএইচ|AH)$/, '') + ' হিজরি';
            } catch (e) {}
            return wd + '\nইংরেজি: ' + en + '\nবাংলা: ' + banglaDate(d) + (ar ? '\nআরবি: ' + ar + ' (আনুমানিক)' : '');
        }
        function liveStory(st) {
            if (st.id === 'st1') return { ...st, text: todayStoryText() };
            if (st.id === 'st4') { const pr = PROVERBS[Math.floor(Date.now() / STORY_TTL) % PROVERBS.length]; return { ...st, text: '"' + pr[0] + '"\nঅর্থ: ' + pr[1] }; }
            return st;
        }
        document.addEventListener('error', e => {
            const t = e.target;
            if (!t || t.tagName !== 'IMG' || t.dataset.fb) return;
            t.dataset.fb = 1;
            if (t.alt === 'Post image') t.parentElement.style.display = 'none'; else t.src = getAutoAvatar();
        }, true);

        const professions = [
            "কৃষক (Farmer)", "ছাত্র (Student)", "শিক্ষক (Teacher)", "প্রকৌশলী (Engineer)", 
            "ডাক্তার (Doctor)", "ব্যবসায়ী (Business)", "প্রবাসী (Expatriate)", "চাকরিজীবী (Service Holder)"
        ];

        function getAutoAvatar() {
            const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><rect width="96" height="96" fill="#d1fae5"/><circle cx="48" cy="38" r="17" fill="#059669"/><path d="M14 96c2-22 18-32 34-32s32 10 34 32z" fill="#059669"/></svg>';
            return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
        }

        let fixedStories = [
            { id: 'st1', title: 'আজকের তারিখ', text: 'ইংরেজি: ১৯ নভেম্বর ২০২৬ | বাংলা: ৪ অগ্রহায়ণ ১৪৩৩ | আরবি: ৮ জমাদিউল উলা ১৪৪৮ হিজরি।' },
            { id: 'st2', title: 'আজকের কুরআন আয়াত', text: '"তোমরা ধৈর্য ও সালাতের মাধ্যমে সাহায্য প্রার্থনা করো।" (সুরা বাকারা: ৪৫)' },
            { id: 'st3', title: 'আজকের হাদিস', text: '"তোমাদের মধ্যে সেই ব্যক্তি উত্তম, যে নিজে কুরআন শেখে এবং অপরকে শেখায়।" (বুখারি)' },
            { id: 'st4', title: 'বাংলার প্রবাদ', text: '"চরে খাওয়া মানুষের মনে অহংকার থাকে না, পরিশ্রমই তাদের বড় পুঁজি।"' },
            { id: 'st5', title: 'সর্বশেষ সংবাদ', text: 'ক্লাউড রিয়েল-টাইম সার্ভার সিঙ্ক সক্রিয় রয়েছে।' }
        ];

        let storyIndex = 0;

        let state = {
            currentUser: null,
            authReady: false,
            adminIds: new Set(),
            signingUp: false,
            pendingVerify: false,
            activating: false,
            postLimit: 15,
            postsMore: false,
            memberQuery: '',
            users: [],
            posts: [],
            notifications: [],
            currentView: 'login',
            activeModalPostId: null,
            viewingProfilePhone: null
        };

        // --- Cloud Firestore (separate collections + per-user Auth) ---
        const synced = { users: {}, posts: {}, notifications: {}, stories: JSON.stringify(fixedStories) };
        const idOf = (col, o) => col === 'users' ? o.uid : o.id;
        const strip = (col, o) => { if (col !== 'users') return o; const { isEditor, email, password, ...r } = o; return r; };
        const byNewest = (a, b) => (b.createdAt || 0) - (a.createdAt || 0);

        // Writes only the documents that changed since the last sync
        async function saveDataToCloud() {
            if (!auth.currentUser) return;
            try {
                const batch = db.batch();
                let n = 0;
                for (const col of ['users', 'posts', 'notifications']) {
                    const cur = {};
                    state[col].forEach(o => { cur[idOf(col, o)] = strip(col, o); });
                    for (const id in cur) {
                        const j = JSON.stringify(cur[id]);
                        if (synced[col][id] !== j) { batch.set(db.collection(col).doc(id), cur[id]); synced[col][id] = j; n++; }
                    }
                    for (const id in synced[col]) {
                        if (!(id in cur)) { batch.delete(db.collection(col).doc(id)); delete synced[col][id]; n++; }
                    }
                }
                const st = JSON.stringify(fixedStories);
                if (state.currentUser && state.currentUser.isEditor && st !== synced.stories) {
                    batch.set(db.collection('config').doc('stories'), { items: fixedStories, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }); synced.stories = st; n++;
                }
                if (n) await batch.commit();
            } catch (error) {
                console.error('Cloud Save Error: ', error);
                alert('সংরক্ষণ করা যায়নি (অনুমতি নেই বা নেটওয়ার্ক সমস্যা)।');
            }
        }

        function applyMe() {
            const au = auth.currentUser;
            if (!au) return false;
            state.users.forEach(u => { u.isEditor = state.adminIds.has(u.uid); });
            const me = state.users.find(u => u.uid === au.uid);
            if (!me) return false;
            const first = !state.currentUser;
            state.currentUser = Object.assign({}, me, { email: au.email });
            if (first) {
                state.authReady = true;
                if (state.currentView === 'login' || state.currentView === 'signup') state.currentView = 'feed';
                startNotifListener(me.phone);
            }
            return true;
        }

        let unsubs = [], notifUnsub = null, postsUnsub = null;
        function stopListeners() {
            unsubs.forEach(u => u()); unsubs = [];
            if (notifUnsub) { notifUnsub(); notifUnsub = null; }
            if (postsUnsub) { postsUnsub(); postsUnsub = null; }
        }
        function startNotifListener(phone) {
            if (notifUnsub) notifUnsub();
            notifUnsub = db.collection('notifications').where('recipientPhone', '==', phone).onSnapshot(snap => {
                state.notifications = snap.docs.map(d => d.data()).sort(byNewest);
                synced.notifications = {};
                state.notifications.forEach(o => { synced.notifications[o.id] = JSON.stringify(o); });
                render();
            }, e => console.error(e));
        }
        // Newest posts first; "load more" raises the limit. No expiry/TTL anywhere: posts stay until the author or an admin deletes them.
        function startPostsListener() {
            if (postsUnsub) postsUnsub();
            postsUnsub = db.collection('posts').orderBy('createdAt', 'desc').limit(state.postLimit).onSnapshot(snap => {
                state.postsMore = snap.docs.length >= state.postLimit;
                state.posts = snap.docs.map(d => d.data());
                synced.posts = {};
                state.posts.forEach(o => { synced.posts[o.id] = JSON.stringify(o); });
                render();
            }, e => console.error(e));
        }
        function loadMorePosts() { state.postLimit += 15; startPostsListener(); }

        // ---- Story cards: refreshed from the internet every 6 hours ----
        const STORY_TTL = 6 * 3600 * 1000;
        let storiesUpdatedAt = 0, storyBusy = false, storyLastTry = 0;
        const PROVERBS = [
            ['অতি লোভে তাঁতি নষ্ট।', 'বেশি লোভ করলে যা আছে তাও হারাতে হয়।'],
            ['এক হাতে তালি বাজে না।', 'ঝগড়া বা কাজ, দুই পক্ষ ছাড়া হয় না।'],
            ['নাচতে না জানলে উঠান বাঁকা।', 'নিজের অক্ষমতার দোষ অন্যের ঘাড়ে চাপানো।'],
            ['সবুরে মেওয়া ফলে।', 'ধৈর্য ধরলে ভালো ফল পাওয়া যায়।'],
            ['যত গর্জে তত বর্ষে না।', 'যারা বেশি বড়াই করে তারা কাজে কম দেখায়।'],
            ['ঘরের শত্রু বিভীষণ।', 'আপনজনের বিশ্বাসঘাতকতাই সবচেয়ে ক্ষতিকর।'],
            ['অতি দর্পে হত লঙ্কা।', 'অহংকারের পতন অনিবার্য।'],
            ['শাক দিয়ে মাছ ঢাকা যায় না।', 'অন্যায় বা সত্য লুকিয়ে রাখা যায় না।'],
            ['যতক্ষণ শ্বাস ততক্ষণ আশ।', 'শেষ মুহূর্ত পর্যন্ত আশা ছাড়তে নেই।'],
            ['সময়ের এক ফোঁড়, অসময়ের দশ ফোঁড়।', 'সময়মতো কাজ করলে পরে বড় ঝামেলা এড়ানো যায়।'],
            ['দশের লাঠি একের বোঝা।', 'সবাই মিলে করলে কাজ সহজ হয়।'],
            ['ডুবে ডুবে জল খাওয়া।', 'সবার অজান্তে গোপনে অন্যায় করা।'],
            ['কয়লা ধুলেও ময়লা যায় না।', 'খারাপ স্বভাব সহজে বদলায় না।'],
            ['আপনা মাংসে হরিণা বৈরী।', 'নিজের গুণ বা সম্পদই অনেক সময় নিজের বিপদ ডেকে আনে।'],
            ['অভাবে স্বভাব নষ্ট।', 'অভাবে পড়লে মানুষের আচরণ বদলে যায়।'],
            ['তেলা মাথায় তেল দেওয়া।', 'যার আছে তাকেই আরও দেওয়া।']
        ];
        PROVERBS.push(
            ["অতি চালাকের গলায় দড়ি।", "বেশি চালাকি করলে নিজেই বিপদে পড়তে হয়।"],
            ["অল্প বিদ্যা ভয়ঙ্করী।", "অল্প জেনে বড়াই করা বিপজ্জনক।"],
            ["আগে দর্শনধারী পরে গুণবিচারি।", "প্রথমে বাইরের রূপ আকৃষ্ট করে, গুণ বোঝা যায় পরে।"],
            ["আপনি বাঁচলে বাপের নাম।", "নিজে নিরাপদ থাকলে তবেই অন্য সবকিছু।"],
            ["আঙুল ফুলে কলাগাছ।", "হঠাৎ করে ধনী বা প্রভাবশালী হয়ে ওঠা।"],
            ["ইচ্ছা থাকলে উপায় হয়।", "মনের জোর থাকলে কাজের পথ ঠিক বের হয়।"],
            ["উচিত কথায় বন্ধু বেজার।", "সত্য কথা বললে অনেক সময় বন্ধুও রাগ করে।"],
            ["উদোর পিণ্ডি বুধোর ঘাড়ে।", "একজনের দোষ অন্যজনের ওপর চাপানো।"],
            ["এক মাঘে শীত যায় না।", "একবার বিপদ কাটলেই সবসময় নিরাপদ থাকা যায় না।"],
            ["কাজের সময় কাজি, কাজ ফুরালে পাজি।", "প্রয়োজন মিটে গেলে উপকারীকে ভুলে যাওয়া।"],
            ["কান টানলে মাথা আসে।", "একটা সূত্র ধরে পুরো ব্যাপার বেরিয়ে আসে।"],
            ["কারও পৌষ মাস, কারও সর্বনাশ।", "একজনের সুখ অন্যের দুঃখের কারণ হতে পারে।"],
            ["কুকুরের পেটে ঘি হজম হয় না।", "অযোগ্যের হাতে ভালো জিনিস টেকে না।"],
            ["খাল কেটে কুমির আনা।", "নিজেই নিজের বিপদ ডেকে আনা।"],
            ["গরিবের ঘোড়া রোগ।", "সামর্থ্যের বাইরে শখ করা।"],
            ["গাছে কাঁঠাল গোঁফে তেল।", "হাতে পাওয়ার আগেই ভোগের আয়োজন।"],
            ["গাঁয়ে মানে না আপনি মোড়ল।", "নিজেকে নিজেই বড় ভাবা।"],
            ["ঘরের খেয়ে বনের মোষ তাড়ানো।", "নিজের ক্ষতি করে অন্যের কাজ করা।"],
            ["চোরের মার বড় গলা।", "দোষী ব্যক্তিই বেশি চেঁচামেচি করে।"],

        async function fetchJson(url, ms = 9000) {
            const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
            try { const r = await fetch(url, { signal: c.signal }); if (!r.ok) throw new Error(r.status); return await r.json(); }
            finally { clearTimeout(t); }
        }
        const clip = (t, n) => { t = String(t || '').replace(/\s+/g, ' ').trim(); return t.length > n ? t.slice(0, n - 1) + '…' : t; };
        const bnNum = n => Number(n).toLocaleString('bn-BD', { useGrouping: false });

        async function buildFreshStories() {
            const slot = Math.floor(Date.now() / STORY_TTL);
            const next = fixedStories.map(x => ({ ...x })), ok = [];
            const set = (i, id, title, text) => { next[i] = { id, title, text }; ok.push(id); };
            await Promise.all([
                (async () => { // Quran ayah (Bengali translation)
                    const n = (slot * 37) % 6236 + 1;
                    const a = (await fetchJson('https://api.alquran.cloud/v1/ayah/' + n + '/bn.bengali')).data;
                    set(1, 'st2', 'আজকের কুরআন আয়াত', '"' + clip(a.text, 320) + '" (সূরা নং ' + bnNum(a.surah.number) + ', আয়াত ' + bnNum(a.numberInSurah) + ')');
                })().catch(() => {}),
                (async () => { // Hadith (Bengali edition)
                    for (const [ed, max, name] of [['ben-bukhari', 4000, 'বুখারি'], ['ben-abudawud', 4000, 'আবু দাউদ']]) {
                        try {
                            const n = (slot * 53) % max + 1;
                            const h = await fetchJson('https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/' + ed + '/' + n + '.json');
                            const t = h.text || (h.hadiths && h.hadiths[0] && h.hadiths[0].text);
                            if (t) { set(2, 'st3', 'আজকের হাদিস', '"' + clip(t, 320) + '" (' + name + ', হাদিস ' + bnNum(n) + ')'); return; }
                        } catch (e) {}
                    }
                })(),
                (async () => { // Latest news (BBC Bangla headlines)
                    const f = await fetchJson('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent('https://feeds.bbci.co.uk/bengali/rss.xml'));
                    const lines = (f.items || []).slice(0, 3).map(i => '• ' + clip(i.title, 110));
                    if (lines.length) set(4, 'st5', 'সর্বশেষ সংবাদ', lines.join('\n') + '\nসূত্র: বিবিসি বাংলা');
                })().catch(() => {})
            ]);
            return { next, fetched: ok.length };
        }

        async function maybeRefreshStories(force = false) {
            if (!auth.currentUser || storyBusy) return false;
            if (!force && (Date.now() - storiesUpdatedAt < STORY_TTL + 60000 || Date.now() - storyLastTry < 15 * 60000)) return false;
            storyBusy = true; storyLastTry = Date.now();
            try {
                const { next, fetched } = await buildFreshStories();
                if (fetched < 1) return false; // internet sources unreachable: keep current cards
                await db.collection('config').doc('stories').set({ items: next, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
                return true;
            } catch (e) { return false; } // e.g. another user refreshed first (rules allow one refresh per 6 hours)
            finally { storyBusy = false; }
        }
        setInterval(() => maybeRefreshStories(), 10 * 60 * 1000);

        function startListeners() {
            const err = e => console.error(e);
            unsubs.push(db.collection('admins').onSnapshot(snap => {
                state.adminIds = new Set(snap.docs.map(d => d.id)); applyMe(); render();
            }, err));
            unsubs.push(db.collection('users').onSnapshot(snap => {
                state.users = snap.docs.map(d => d.data());
                synced.users = {};
                state.users.forEach(o => { synced.users[o.uid] = JSON.stringify(strip('users', o)); });
                if (!applyMe() && !state.signingUp && !snap.metadata.fromCache && !snap.metadata.hasPendingWrites) { auth.signOut(); return; }
                render();
            }, err));
            startPostsListener();
            unsubs.push(db.collection('config').doc('stories').onSnapshot(d => {
                if (d.exists && d.data().items) {
                    fixedStories = d.data().items; synced.stories = JSON.stringify(fixedStories);
                    const ts = d.data().updatedAt;
                    storiesUpdatedAt = ts ? ts.toMillis() : Date.now();
                } else { storiesUpdatedAt = 0; }
                render();
                maybeRefreshStories();
            }, err));
        }

        async function resendVerification() {
            if (!auth.currentUser) return;
            if (Date.now() < resendAt) { alert('একটু অপেক্ষা করে আবার চেষ্টা করুন।'); return; }
            resendAt = Date.now() + 60000;
            try { await auth.currentUser.sendEmailVerification(); alert('ভেরিফিকেশন ইমেইল আবার পাঠানো হয়েছে।'); }
            catch (e) { alert('ইমেইল পাঠানো যায়নি, কিছুক্ষণ পর আবার চেষ্টা করুন।'); }
        }
        async function checkVerified(silent) {
            const u = auth.currentUser;
            if (!u || !state.pendingVerify) return;
            try { await u.reload(); } catch (e) { return; }
            if (!auth.currentUser.emailVerified) { if (!silent) alert('এখনো ভেরিফাই হয়নি। ইমেইলের লিংকে ক্লিক করুন।'); return; }
            await auth.currentUser.getIdToken(true); // refresh the token so the database sees email_verified
            await onVerifiedUser(auth.currentUser);
        }
        setInterval(() => checkVerified(true), 5000);

        async function onVerifiedUser(user) {
            if (state.activating) return;
            state.activating = true; state.signingUp = true;
            try {
                const pd = await db.collection('pending').doc(user.uid).get();
                if (pd.exists) { // first activation: create the real member records
                    const d = pd.data(), b = db.batch();
                    b.set(db.collection('phones').doc(d.phone.replace('+', '')), { uid: user.uid, email: user.email });
                    b.set(db.collection('users').doc(user.uid), d.profile);
                    b.delete(db.collection('pending').doc(user.uid));
                    await b.commit();
                    const nid = 'n_' + Date.now();
                    await db.collection('notifications').doc(nid).set({
                        id: nid, recipientPhone: d.phone, text: 'স্বাগতম উঠান প্ল্যাটফর্মে! আমাদের পরিবারে আপনাকে স্বাগতম।',
                        isRead: false, isEditorBroadcast: false, date: 'এইমাত্র', createdAt: Date.now()
                    }).catch(() => {});
                }
                state.pendingVerify = false;
                state.signingUp = false;
                startListeners();
            } catch (e) {
                console.error(e);
                state.signingUp = false;
                alert('একাউন্ট চালু করা যায়নি। সম্ভবত এই মোবাইল নম্বরে ইতিমধ্যে অন্য একটি আইডি আছে।');
                auth.signOut();
            } finally { state.activating = false; }
        }

        auth.onAuthStateChanged(async user => {
            stopListeners();
            if (!user) {
                state.currentUser = null; state.notifications = []; state.pendingVerify = false; state.authReady = true;
                if (state.currentView !== 'signup') state.currentView = 'login';
                render();
                return;
            }
            if (!user.emailVerified) { // not active until the email is verified
                state.currentUser = null; state.pendingVerify = true; state.authReady = true;
                render();
                return;
            }
            await onVerifiedUser(user);
        });

            const scored = state.users.filter(u => u.phone !== ADMIN).map(u => {
                const mine = state.posts.filter(p => p.authorPhone === u.phone);
                const postCount = mine.length;
                const got = mine.reduce((a, p) => a + reactCount(p), 0);
                const cm = state.posts.reduce((a, p) => a + (p.comments || []).filter(c => c.authorPhone === u.phone).length, 0);
                return { ...u, postCount, performanceScore: postCount * 10 + got * 5 + cm * 3 };

        function loadStoryTextForEdit(index) {
            const story = fixedStories[index];
            document.getElementById('editStoryTitle').value = story.title;
            document.getElementById('editStoryText').value = story.text;
        }

        async function handleUpdateStories(event) {
            event.preventDefault();
            const index = document.getElementById('storySelect').value;
            const title = document.getElementById('editStoryTitle').value.trim();
            const text = document.getElementById('editStoryText').value.trim();

            if (!title || !text) return;

            fixedStories[index].title = title;
            fixedStories[index].text = text;
            await saveDataToCloud();
            alert('স্টোরি সফলভাবে ক্লাউডে আপডেট করা হয়েছে!');
            render();
        }

        async function handleSignup(event) {
            event.preventDefault();
            const name = document.getElementById('signupName').value.trim();
            const rawPhone = document.getElementById('signupPhone').value.trim();
            const profession = document.getElementById('signupProfession').value;
            const age = document.getElementById('signupAge').value;
            const location = document.getElementById('signupLocation').value.trim();
            const sscBatch = document.getElementById('signupBatch').value.trim();
            const password = document.getElementById('signupPassword').value;
            const email = document.getElementById('signupEmail').value.trim().toLowerCase();

            if (!/^1[0-9]{9}$/.test(rawPhone)) { alert('মোবাইল নম্বর অবশ্যই 1 দিয়ে শুরু এবং মোট ১০ ডিজিটের হতে হবে (+880 বাদে)!'); return; }
            if (!/^[0-9]{4}$/.test(sscBatch)) { alert('এসএসসি ব্যাচ অবশ্যই ৪ ডিজিটের হতে হবে!'); return; }
            if (await lookupEmail(rawPhone)) { alert('এই মোবাইল নম্বরে ইতিমধ্যেই একটি আইডি রেজিস্টার্ড রয়েছে!'); return; }

            const phone = '+880' + rawPhone;
            let cred;
            try {
                cred = await auth.createUserWithEmailAndPassword(email, password);
            } catch (e) {
                const m = { 'auth/email-already-in-use': 'এই ইমেইল ইতিমধ্যে ব্যবহৃত হয়েছে!', 'auth/invalid-email': 'ইমেইল সঠিক নয়!', 'auth/weak-password': 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের দিন!' };
                alert(m[e.code] || 'একাউন্ট তৈরি করা যায়নি, আবার চেষ্টা করুন।');
                return;
            }
            const uid = cred.user.uid;
            const profile = { uid, name, phone, profession, age, location, sscBatch, profilePhoto: getAutoAvatar() };
            try {
                // The profile waits in "pending" and becomes a real member only after the email is verified
                await db.collection('pending').doc(uid).set({ uid, phone, email, profile, createdAt: Date.now() });
            } catch (e) {
                await cred.user.delete().catch(() => {});
                alert('একাউন্ট তৈরি করা যায়নি, আবার চেষ্টা করুন।');
                return;
            }
            cred.user.sendEmailVerification().catch(() => {});
        }

        async function lookupEmail(rawPhone) {
            try {
                const d = await db.collection('phones').doc('880' + rawPhone).get();
                return d.exists ? d.data().email : null;
            } catch (e) { return null; }
        }

        function parseLoginId(v) {
            v = v.trim().replace(/\s+/g, '');
            if (v.includes('@')) return { email: v.toLowerCase() };
            const m = v.match(/^(?:\+?880|0)?(1[0-9]{9})$/);
            return m ? { phone: m[1] } : null;
        }

        async function handleLogin(event) {
            event.preventDefault();
            const id = parseLoginId(document.getElementById('loginPhone').value);
            const password = document.getElementById('loginPassword').value;
            if (!id) { alert('সঠিক মোবাইল নম্বর (01XXXXXXXXX) অথবা ইমেইল দিন!'); return; }
            const email = id.email || await lookupEmail(id.phone);
            try {
                if (!email) throw new Error('no-user');
                await auth.signInWithEmailAndPassword(email, password);
            } catch (e) {
                alert('মোবাইল/ইমেইল অথবা পাসওয়ার্ড ভুল হয়েছে!');
            }
        }

        function logout() {
            stopListeners();
            auth.signOut().catch(() => {});
            state.currentUser = null;
            localStorage.removeItem('uthan_current_user');
            switchView('login');
        }

        async function recoverPasswordPrompt() {
            const id = parseLoginId(prompt('আপনার মোবাইল নম্বর অথবা ইমেইল দিন:') || '');
            if (!id) { alert('সঠিক মোবাইল নম্বর বা ইমেইল দিন!'); return; }
            const email = id.email || await lookupEmail(id.phone);
            if (email) { try { await auth.sendPasswordResetEmail(email); } catch (e) { console.error(e); } }
            alert('যদি এই নম্বর/ইমেইলের একাউন্ট থাকে, তাহলে পাসওয়ার্ড রিসেট লিংক ইমেইলে পাঠানো হয়েছে। ইনবক্স ও স্পাম ফোল্ডার দেখুন।');
        }

        async function saveEditedPost(postId) {
            const post = state.posts.find(p => p.id === postId);
            if (!post) return;
            const content = document.getElementById('editPostText').value.trim();
            const image = document.getElementById('editPostImage').value.trim();
            if (!content && !image) { alert('পোস্ট ফাঁকা রাখা যাবে না!'); return; }
            post.content = content; post.image = image; post.editedAt = Date.now();
            closeEditPost();
            await saveDataToCloud();
            render();
        }

        async function deletePost(postId) {
            if (confirm('আপনি কি নিশ্চিত এই পোস্টটি ডিলিট করতে চান? এটি আর ফেরানো যাবে না।')) {

                state.posts = state.posts.filter(p => p.id !== postId);

        }

        async function toggleReaction(postId, reactionType) {
            const post = state.posts.find(p => p.id === postId);
            if (!post) return;

            const alreadySelected = post.reactions[reactionType].includes(state.currentUser.phone);

            Object.keys(post.reactions).forEach(type => {
                post.reactions[type] = post.reactions[type].filter(phone => phone !== state.currentUser.phone);
            });

            if (!alreadySelected) {
                post.reactions[reactionType].push(state.currentUser.phone);
            }

            await saveDataToCloud();
            render();
        }

        async function handleComment(event, postId) {
            event.preventDefault();
            const input = document.getElementById(`comment-input-${postId}`);
            const text = input.value.trim();
            if (!text) return;

            const post = state.posts.find(p => p.id === postId);
            if (!post) return;

            const newComment = {
                id: 'c_' + Date.now(),
                authorPhone: state.currentUser.phone,
                authorName: state.currentUser.name,
                text
            };

            post.comments.push(newComment);

            if (post.authorPhone !== state.currentUser.phone) {
                state.notifications.unshift({
                    id: 'n_' + Date.now(),
                    recipientPhone: post.authorPhone,
                    postId: post.id,
                    text: `${state.currentUser.name} আপনার পোস্টে মন্তব্য করেছেন।`,
                    isRead: false,
                    isEditorBroadcast: false,
                    date: 'এইমাত্র', createdAt: Date.now()
                });
            }

            await saveDataToCloud();
            input.value = '';
            render();
            if (state.activeModalPostId) state.activeModalPostId = postId;
        }

        async function deleteComment(postId, commentId) {
            const post = state.posts.find(p => p.id === postId);
            if (!post || !confirm('মন্তব্যটি মুছে ফেলবেন?')) return;
            post.comments = (post.comments || []).filter(c => c.id !== commentId);

        }

        async function promptChangePassword() {

            const sscBatch = document.getElementById('editBatch').value.trim();

                u.location = state.currentUser.location;

        async function adminDeleteUser(phone) {
            if (confirm(`অ্যাডমিন এক্সেস: আপনি কি নিশ্চিত এই ইউজার (${phone}) এবং তার সমস্ত ডাটা মুছে ফেলতে চান?`)) {
                db.collection('phones').doc(phone.replace('+', '')).delete().catch(() => {});
                state.users = state.users.filter(u => u.phone !== phone);
                state.posts = state.posts.filter(p => p.authorPhone !== phone);

                switchView('all_members');
            }
        }

        async function handleEditorBroadcast(event) {
            event.preventDefault();
            const target = document.getElementById('broadcastTarget').value;
            const text = document.getElementById('broadcastText').value.trim();
            if (!text) return;

            if (target === 'ALL') {
                state.users.forEach(u => {
                    state.notifications.unshift({
                        id: 'nb_' + Date.now() + '_' + u.phone,
                        recipientPhone: u.phone,
                        text: `[অ্যাডমিন ঘোষণা]: ${text}`,
                        isRead: false,
                        isEditorBroadcast: true,
                        date: 'এইমাত্র', createdAt: Date.now()
                    });
                });
            } else {
                state.notifications.unshift({
                    id: 'nb_' + Date.now(),
                    recipientPhone: target,
                    text: `[ব্যক্তিগত অ্যাডমিন বার্তা]: ${text}`,
                    isRead: false,
                    isEditorBroadcast: true,
                    date: 'এইমাত্র', createdAt: Date.now()
                });
            }

            document.getElementById('broadcastText').value = '';
            await saveDataToCloud();
            alert('বিজ্ঞপ্তি সফলভাবে পাঠানো হয়েছে!');
            render();
        }

        function render() {
            const app = document.getElementById('app');
            if (!state.authReady) { app.innerHTML = '<div class="min-h-screen flex items-center justify-center text-stone-500 text-sm">লোড হচ্ছে...</div>'; return; }
            if (state.pendingVerify && auth.currentUser) { app.innerHTML = renderVerify(); return; }
            let contentHTML = '';

            if (!state.currentUser) {
                if (state.currentView === 'signup') {
                    contentHTML = renderSignup();
                } else {
                    contentHTML = renderLogin();
                }
            } else {
                switch (state.currentView) {
                    case 'feed':
                        contentHTML = renderFeed();
                        break;
                    case 'notifications':
                        contentHTML = renderNotifications();
                        break;
                    case 'profile':
                        contentHTML = renderProfile(state.viewingProfilePhone);
                        break;
                    case 'all_members':
                        contentHTML = renderAllMembers();
                        break;
                    case 'editor_panel':
                        contentHTML = renderEditorPanel();
                        break;
                    default:
                        contentHTML = renderFeed();
                }
            }

            contentHTML += renderPostModal();
            // Keep what the user is typing when a live update re-renders the page
            const saved = {};
            app.querySelectorAll('#postContent, #postImage, [id^="comment-input-"]').forEach(el => { if (el.value) saved[el.id] = el.value; });
            const a = document.activeElement;
            const focusId = a && app.contains(a) ? a.id : null;
            const pos = a ? a.selectionStart : null;
            app.innerHTML = contentHTML;
            Object.keys(saved).forEach(id => { const el = document.getElementById(id); if (el && !el.value) el.value = saved[id]; });
            if (focusId) {
                const el = document.getElementById(focusId);
                if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} }
            }
        }


    </script>
