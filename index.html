        // কাস্টম মেসেজ বক্স (alert ও confirm এর পরিবর্তে)

        function esc(v) {
            return String(v ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function safeUrl(u) {
            u = String(u || '').trim();
            if (u.startsWith('data:image/')) return esc(u);
            try {
                const x = new URL(u);
                return (x.protocol === 'https:' || x.protocol === 'http:') ? esc(u) : '';
            } catch (e) { return ''; }
        }

        const bnNum = n => Number(n).toLocaleString('bn-BD', { useGrouping: false });
        const clip = (t, n) => {
            t = String(t || '').replace(/\s+/g, ' ').trim();
            return t.length > n ? t.slice(0, n - 1) + '…' : t;
        };

        function getAutoAvatar() {
            const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><rect width="96" height="96" fill="#dcfce7"/><circle cx="48" cy="38" r="17" fill="#16a34a"/><path d="M14 96c2-22 18-32 34-32s32 10 34 32z" fill="#16a34a"/></svg>';
            return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
        }

        document.addEventListener('error', e => {
            const t = e.target;
            if (!t || t.tagName !== 'IMG' || t.dataset.fb) return;
            t.dataset.fb = 1;
            if (t.alt === 'Post image' || t.alt === 'Popup image') t.parentElement.style.display = 'none';

        function timeAgo(ts, fallback) {
            if (!ts) return fallback || 'এইমাত্র';
            const s = Math.floor((Date.now() - ts) / 1000);
            if (s < 60) return 'এইমাত্র';
            if (s < 3600) return bnNum(Math.floor(s / 60)) + ' মিনিট আগে';
            if (s < 86400) return bnNum(Math.floor(s / 3600)) + ' ঘণ্টা আগে';
            if (s < 2592000) return bnNum(Math.floor(s / 86400)) + ' দিন আগে';
            return new Date(ts).toLocaleDateString('bn-BD', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        // ২. বাংলাদেশ স্ট্যান্ডার্ড টাইম ও সঠিক খ্রিস্টাব্দ, বাংলা সন, হিজরি মাসের নাম
        function getBangladeshDateObj() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            return new Date(utc + (6 * 3600000)); // UTC+6 (BST)
        }

        function getStandardTimeBD() {
            const d = getBangladeshDateObj();
            const h = d.getHours();
            const m = String(d.getMinutes()).padStart(2, '0');
            const s = String(d.getSeconds()).padStart(2, '0');
            let period = 'রাত';
            if (h >= 4 && h < 6) period = 'ভোর';
            else if (h >= 6 && h < 12) period = 'সকাল';
            else if (h >= 12 && h < 15) period = 'দুপুর';
            else if (h >= 15 && h < 18) period = 'বিকাল';
            else if (h >= 18 && h < 20) period = 'সন্ধ্যা';

            const h12 = h % 12 || 12;
            const toBnDigits = str => str.replace(/\d/g, digit => '০১২৩৪৫৬৭৮৯'[digit]);
            return `${period} ${toBnDigits(String(h12))}:${toBnDigits(m)}:${toBnDigits(s)} (BST)`;
        }

        function banglaDate(d = getBangladeshDateObj()) {
            const y = d.getFullYear();
            let sy = y, by = y - 593;
            // পহেলা বৈশাখ ১৪ এপ্রিল থেকে শুরু (সংশোধিত বাংলা একাডেমি বর্ষপঞ্জি)
            if (Date.UTC(y, d.getMonth(), d.getDate()) < Date.UTC(y, 3, 14)) {
                sy = y - 1;
                by = y - 594;
            }
            let off = Math.round((Date.UTC(y, d.getMonth(), d.getDate()) - Date.UTC(sy, 3, 14)) / 864e5);
            const ny = sy + 1;
            const leap = (ny % 4 === 0 && ny % 100 !== 0) || ny % 400 === 0;
            // বৈশাখ থেকে আশ্বিন ৩১ দিন, কার্তিক থেকে মাঘ ৩০ দিন, ফাল্গুন ২৯/৩০ দিন, চৈত্র ৩০ দিন
            const lens = [31, 31, 31, 31, 31, 31, 30, 30, 30, 30, leap ? 30 : 29, 30];
            const names = ['বৈশাখ', 'জ্যৈষ্ঠ', 'আষাঢ়', 'শ্রাবণ', 'ভাদ্র', 'আশ্বিন', 'কার্তিক', 'অগ্রহায়ণ', 'পৌষ', 'মাঘ', 'ফাল্গুন', 'চৈত্র'];
            let m = 0;
            while (m < 11 && off >= lens[m]) { off -= lens[m]; m++; }
            return `${bnNum(off + 1)} ${names[m]} ${bnNum(by)} বাংলা সন`;
        }

        function hijriDateBD(d = getBangladeshDateObj()) {
            // বাংলাদেশের চাঁদ দেখা অনুযায়ী সাধারণত সৌদি উম্মুল কুরা থেকে ১ দিন পার্থক্য সমন্বয়
            const bdDay = new Date(d.getTime() - 864e5);
            const hijriMonthsBn = {
                'Muharram': 'মুহররম',
                'Safar': 'সফর',
                'Rabiʻ I': 'রবিউল আউয়াল',
                'Rabiʻ II': 'রবিউস সানি',
                'Jumada I': 'জমাদিউল আউয়াল',
                'Jumada II': 'জমাদিউস সানি',
                'Rajab': 'রজব',
                'Shaʻban': 'শাবান',
                'Ramadan': 'রমজান',
                'Shawwal': 'শাওয়াল',
                'Dhuʻl-Qiʻdah': 'জিলকদ',
                'Dhuʻl-Hijjah': 'জিলহজ'
            };
            try {
                const parts = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', {
                    day: 'numeric',
                    month: 'long',
                    year: 'numeric'
                }).formatToParts(bdDay);
                const day = parts.find(p => p.type === 'day')?.value;
                const monthEn = parts.find(p => p.type === 'month')?.value;
                const year = parts.find(p => p.type === 'year')?.value;
                if (day && monthEn && year) {
                    const monthBn = hijriMonthsBn[monthEn] || monthEn;
                    return `${bnNum(day)} ${monthBn} ${bnNum(year)} হিজরি`;
                }
            } catch (e) {}
            return '';
        }

        function englishDateBn(d = getBangladeshDateObj()) {
            const months = ['জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'];
            const days = ['রবিবার', 'সোমবার', 'মঙ্গলবার', 'বুধবার', 'বৃহস্পতিবার', 'শুক্রবার', 'শনিবার'];
            return {
                weekday: days[d.getDay()],
                full: `${bnNum(d.getDate())} ${months[d.getMonth()]} ${bnNum(d.getFullYear())} খ্রিস্টাব্দ`
            };
        }

        function todayStoryText() {
            const d = getBangladeshDateObj();
            const en = englishDateBn(d);
            const bn = banglaDate(d);
            const ar = hijriDateBD(d);
            const timeStr = getStandardTimeBD();
            return `বার: ${en.weekday} | সময়: ${timeStr}\nখ্রিস্টাব্দ: ${en.full}\nবাংলা: ${bn}${ar ? `\nআরবি: ${ar}` : ''}`;
        }

        function liveStory(st) {
            if (st.id === 'st1') return { ...st, text: todayStoryText() };
            if (st.id === 'st4') {
                const slot = Math.floor(Date.now() / OTHER_TTL);
                const pr = PROVERBS[slot % PROVERBS.length];
                return { ...st, text: `“${pr[0]}”\nভাবার্থ: ${pr[1]}` };
            }
            return st;
        }

        // প্রতি সেকেন্ডে লাইভ ঘড়ি আপডেট (শুধুমাত্র টেক্সট নোড আপডেট করে, পুরো পেজ রি-রেন্ডার না করে যাতে অতি দ্রুত থাকে)
        setInterval(() => {
            const clockEl = document.getElementById('live-bst-clock');
            if (clockEl) clockEl.textContent = getStandardTimeBD();
            const stTextEl = document.getElementById('live-story-text');
            if (stTextEl && fixedStories[storyIndex % fixedStories.length]?.id === 'st1') {
                stTextEl.textContent = todayStoryText();
            }
        }, 1000);

        async function fetchJson(url, ms = 6500) {
            const c = new AbortController();
            const t = setTimeout(() => c.abort(), ms);
            try {
                const r = await fetch(url, { signal: c.signal });
                if (!r.ok) throw new Error(r.status);
                return await r.json();
            } finally { clearTimeout(t); }
        }

        // দ্রুত সংবাদ আপডেট
        async function refreshNewsEveryHour(force = false) {
            if (!auth.currentUser || newsBusy) return false;
            if (!force && (Date.now() - newsUpdatedAt < NEWS_TTL)) return false;
            newsBusy = true;
            try {
                const f = await fetchJson('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent('https://feeds.bbci.co.uk/bengali/rss.xml'));
                const lines = (f.items || []).slice(0, 3).map(i => '• ' + clip(i.title, 120));
                if (!lines.length) return false;
                const newsText = lines.join('\n') + '\n— সূত্র: বিবিসি বাংলা';
                fixedStories[4] = { id: 'st5', title: 'সর্বশেষ সংবাদ', text: newsText };
                newsUpdatedAt = Date.now();
                saveLocalStoriesCache();
                if (state.currentUser?.isEditor) {
                    db.collection('config').doc('stories').set({
                        items: fixedStories,
                        newsUpdatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true }).catch(() => {});
                }
                render();
                if (force) showToast('সর্বশেষ সংবাদ আপডেট হয়েছে!');
                return true;
            } catch (e) {
                return false;
            } finally {
                newsBusy = false;
            }
        }

        // পূর্ণ কুরআন আয়াত ও পূর্ণ হাদিস (কোনো টেক্সট না কেটে)
        async function refreshOtherStoriesEvery6Hours(force = false) {
            if (!auth.currentUser || storyBusy) return false;
            if (!force && (Date.now() - otherUpdatedAt < OTHER_TTL)) return false;
            storyBusy = true;
            try {
                const slot = force ? Math.floor(Date.now() / 1000) : Math.floor(Date.now() / OTHER_TTL);
                const next = fixedStories.map(x => ({ ...x }));
                let ok = 0;

                await Promise.all([
                    (async () => {
                        const n = (slot * 37) % 6236 + 1;
                        const a = (await fetchJson('https://api.alquran.cloud/v1/ayah/' + n + '/bn.bengali')).data;
                        const surahName = a.surah.englishName || `সূরা ${bnNum(a.surah.number)}`;
                        next[1] = {
                            id: 'st2',
                            title: 'আজকের পূর্ণ কুরআন আয়াত',
                            text: `“${a.text.trim()}”\n— ${surahName} (${bnNum(a.surah.number)}), আয়াত নং: ${bnNum(a.numberInSurah)}`
                        };
                        ok++;
                    })().catch(() => {}),
                    (async () => {
                        const editions = [
                            ['ben-bukhari', 4000, 'সহীহ বুখারী'],
                            ['ben-muslim', 3000, 'সহীহ মুসলিম'],
                            ['ben-abudawud', 3500, 'সুনানে আবু দাউদ']
                        ];
                        for (const [ed, max, name] of editions) {
                            try {
                                const n = (slot * 53) % max + 1;
                                const h = await fetchJson(`https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/${ed}/${n}.json`);
                                const t = h.text || (h.hadiths && h.hadiths[0] && h.hadiths[0].text);
                                if (t && t.trim()) {
                                    next[2] = {
                                        id: 'st3',
                                        title: 'আজকের পূর্ণ হাদিস',
                                        text: `“${t.trim()}”\n— ${name}, হাদিস নং: ${bnNum(n)}`
                                    };
                                    ok++;
                                    return;
                                }
                            } catch (e) {}
                        }
                    })()
                ]);

                if (ok < 1) return false;
                fixedStories = next;
                otherUpdatedAt = Date.now();
                saveLocalStoriesCache();
                if (state.currentUser?.isEditor) {
                    db.collection('config').doc('stories').set({
                        items: fixedStories,
                        otherUpdatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true }).catch(() => {});
                }
                render();
                if (force) showToast('পূর্ণ কুরআন ও হাদিস আপডেট হয়েছে!');
                return true;
            } catch (e) {
                return false;
            } finally {
                storyBusy = false;
            }
        }

        setInterval(() => refreshNewsEveryHour(false), 15 * 60 * 1000);
        setInterval(() => refreshOtherStoriesEvery6Hours(false), 30 * 60 * 1000);

        async function saveDataToCloud() {
            if (!auth.currentUser) return;
            try {
                const batch = db.batch();
                let n = 0;
                for (const col of ['users', 'posts', 'notifications']) {
                    const cur = {};
                    state[col].forEach(o => { cur[idOf(col, o)] = strip(col, o); });
                    for (const id in cur) {
                        const j = JSON.stringify(cur[id]);
                        if (synced[col][id] !== j) {
                            batch.set(db.collection(col).doc(id), cur[id]);
                            synced[col][id] = j;
                            n++;
                        }
                    }
                    for (const id in synced[col]) {
                        if (!(id in cur)) {
                            batch.delete(db.collection(col).doc(id));
                            delete synced[col][id];
                            n++;
                        }
                    }
                }
                const st = JSON.stringify(fixedStories);
                if (state.currentUser && state.currentUser.isEditor && st !== synced.stories) {
                    batch.set(db.collection('config').doc('stories'), {
                        items: fixedStories,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });
                    synced.stories = st;
                    n++;
                }
                if (n) await batch.commit();
            } catch (error) {
                console.error('Cloud Save Error:', error);
                showToast('সংরক্ষণ করা যায়নি। আবার চেষ্টা করুন।', true);
            }
        }

        function applyMe() {
            const au = auth.currentUser;
            if (!au) return false;
            const emailMatchEditor = (au.email || '').toLowerCase() === EDITOR_EMAIL;
            state.users.forEach(u => {
                u.isEditor = state.adminIds.has(u.uid) || (emailMatchEditor && u.uid === au.uid);
            });
            let me = state.users.find(u => u.uid === au.uid);
            if (!me && emailMatchEditor) {
                me = {
                    uid: au.uid,
                    name: 'প্রধান সম্পাদক',
                    phone: '+8801700000000',
                    profession: 'সম্পাদক',
                    age: '৩০',
                    location: 'ঢাকা',
                    sscBatch: '2015',
                    profilePhoto: getAutoAvatar(),
                    isEditor: true
                };
                state.users.push(me);
                db.collection('users').doc(au.uid).set(strip('users', me), { merge: true }).catch(() => {});
                db.collection('admins').doc(au.uid).set({ email: EDITOR_EMAIL, role: 'editor' }, { merge: true }).catch(() => {});
            }
            if (!me) return false;
            const first = !state.currentUser;
            state.currentUser = Object.assign({}, me, {
                email: au.email,
                isEditor: state.adminIds.has(au.uid) || emailMatchEditor
            });
            if (first) {
                state.authReady = true;
                if (state.currentView === 'login' || state.currentView === 'signup') state.currentView = 'feed';
                startNotifListener(me.phone);
                refreshNewsEveryHour(false);
                refreshOtherStoriesEvery6Hours(false);
            }
            return true;
        }

        let unsubs = [], notifUnsub = null, postsUnsub = null;

        function stopListeners() {
            unsubs.forEach(u => u());
            unsubs = [];
            if (notifUnsub) { notifUnsub(); notifUnsub = null; }
            if (postsUnsub) { postsUnsub(); postsUnsub = null; }
        }

        function startNotifListener(phone) {
            if (notifUnsub) notifUnsub();
            notifUnsub = db.collection('notifications').where('recipientPhone', '==', phone).onSnapshot(snap => {
                state.notifications = snap.docs.map(d => d.data()).sort(byNewest);
                synced.notifications = {};
                state.notifications.forEach(o => { synced.notifications[o.id] = JSON.stringify(o); });
                render();
            }, e => console.error(e));
        }

        function startPostsListener() {
            if (postsUnsub) postsUnsub();
            postsUnsub = db.collection('posts').orderBy('createdAt', 'desc').limit(state.postLimit).onSnapshot(snap => {
                state.postsMore = snap.docs.length >= state.postLimit;
                state.posts = snap.docs.map(d => d.data());
                synced.posts = {};
                state.posts.forEach(o => { synced.posts[o.id] = JSON.stringify(o); });
                render();
            }, e => console.error(e));
        }

        function loadMorePosts() {
            state.postLimit += 15;
            startPostsListener();
        }

        function startListeners() {
            const err = e => console.error(e);
            unsubs.push(db.collection('admins').onSnapshot(snap => {
                state.adminIds = new Set(snap.docs.map(d => d.id));
                applyMe();
                render();
            }, err));

            unsubs.push(db.collection('users').onSnapshot(snap => {
                state.users = snap.docs.map(d => d.data());
                synced.users = {};
                state.users.forEach(o => { synced.users[o.uid] = JSON.stringify(strip('users', o)); });
                if (!applyMe() && !state.signingUp && !snap.metadata.fromCache && !snap.metadata.hasPendingWrites) {
                    auth.signOut();
                    return;
                }
                render();
            }, err));

            startPostsListener();

            unsubs.push(db.collection('config').doc('stories').onSnapshot(d => {
                if (d.exists && Array.isArray(d.data().items)) {
                    fixedStories = d.data().items;
                    synced.stories = JSON.stringify(fixedStories);
                    const nTs = d.data().newsUpdatedAt || d.data().updatedAt;
                    const oTs = d.data().otherUpdatedAt || d.data().updatedAt;
                    if (nTs && nTs.toMillis) newsUpdatedAt = nTs.toMillis();
                    if (oTs && oTs.toMillis) otherUpdatedAt = oTs.toMillis();
                    saveLocalStoriesCache();
                }
                render();
                refreshNewsEveryHour(false);
                refreshOtherStoriesEvery6Hours(false);
            }, err));

            // এডিটর প্যানেল থেকে সেট করা পপআপ উইন্ডো লিসেনার
            unsubs.push(db.collection('config').doc('popup').onSnapshot(d => {
                if (d.exists) {
                    state.popupConfig = d.data();
                } else {
                    state.popupConfig = null;
                }
                render();
            }, err));
        }

        // কোনো ইমেইল ভেরিফিকেশন ছাড়াই সরাসরি লগইন স্টেট হ্যান্ডলার
        auth.onAuthStateChanged(async user => {
            stopListeners();
            if (!user) {
                state.currentUser = null;
                state.notifications = [];
                state.authReady = true;
                if (state.currentView !== 'signup') state.currentView = 'login';
                render();
                return;
            }
            startListeners();
        });

                            <div class="w-10 h-10 rounded-xl bg-white border border-emerald-200 text-emerald-700 flex items-center justify-center flex-shrink-0">
                                <i class="fa-solid ${storyIcons[currentStory.id] || 'fa-star'} text-base"></i>
                            </div>
                            <div class="flex-grow min-w-0">
                                <div class="flex items-center justify-between gap-2">
                                    <span class="text-xs font-bold text-emerald-800">
                                        ${esc(currentStory.title)}${currentStory.id === 'st5' && newsUpdatedAt ? ' · ' + timeAgo(newsUpdatedAt) : ''}
                                    </span>
                                    <span class="text-[11px] font-semibold text-neutral-500">${bnNum((storyIndex % fixedStories.length) + 1)}/${bnNum(fixedStories.length)}</span>
                                </div>
                                <p id="live-story-text" class="text-sm text-neutral-900 font-medium leading-relaxed mt-1.5 whitespace-pre-line break-words">${esc(currentStory.text)}</p>
                            </div>
                        </div>
                        <div class="flex items-center justify-between mt-4 pt-3 border-t border-emerald-200/70">
                            <div class="flex gap-1.5">
                                ${fixedStories.map((st, i) => `
                                    <button onclick="goStory(${i})" title="${esc(st.title)}" class="h-1.5 rounded-full transition-all ${i === storyIndex % fixedStories.length ? 'w-6 bg-emerald-600' : 'w-2 bg-emerald-200 hover:bg-emerald-300'}"></button>
                                `).join('')}
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="prevStory()" class="bg-white hover:bg-emerald-100/70 text-neutral-800 border border-emerald-200 px-3 py-1 rounded-lg text-xs font-semibold transition">
                                    <i class="fa-solid fa-arrow-left"></i>
                                </button>
                                <button onclick="nextStory()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-1 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition">
                                    পরবর্তী <i class="fa-solid fa-arrow-right"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- পোস্ট তৈরির কার্ড -->
                    <div class="clean-card p-4">
                        <div class="flex items-center space-x-3 mb-3">
                            <img src="${safeUrl(state.currentUser.profilePhoto)}" class="w-9 h-9 rounded-full border border-neutral-200 object-cover">
                            <div>
                                <h4 class="font-bold text-sm text-neutral-900">${esc(state.currentUser.name)}</h4>
                                <span class="text-[11px] bg-emerald-50 text-emerald-800 border border-emerald-200 px-2 py-0.5 rounded-full font-medium">${esc(state.currentUser.profession)}</span>
                            </div>
                        </div>
                        <form onsubmit="handleCreatePost(event)" class="space-y-3">
                            <textarea id="postContent" rows="3" maxlength="5000" placeholder="আজ আপনার মনে কী চলছে?" class="w-full p-3 rounded-xl border border-neutral-200 focus:border-emerald-600 focus:outline-none text-sm resize-none bg-neutral-50/50"></textarea>
                            <div class="flex items-center justify-between gap-2">
                                <input type="text" id="postImage" placeholder="ছবির লিংক (ঐচ্ছিক)" class="w-2/3 px-3 py-2 rounded-xl border border-neutral-200 text-xs focus:border-emerald-600 focus:outline-none">
                                <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-xl text-xs font-bold transition">পোস্ট করুন</button>
                            </div>
                        </form>
                    </div>

                    <!-- পোস্ট ফিড -->
                    <div class="space-y-4">
                        ${visiblePosts.length === 0 ? '<p class="text-center text-neutral-500 py-10 text-sm clean-card">এখনো কোনো পোস্ট নেই।</p>' : ''}
                        ${visiblePosts.map(post => renderPostCard(post)).join('')}
                        ${state.postsMore ? '<button onclick="loadMorePosts()" class="w-full py-2.5 rounded-xl bg-white border border-neutral-200 text-emerald-700 text-xs font-bold hover:bg-emerald-50 transition">আরও পোস্ট দেখুন</button>' : ''}
                    </div>
                </main>
            `;
        }

        function goStory(i) {
            storyIndex = i;
            render();
        }

        function prevStory() {
            storyIndex = (storyIndex - 1 + fixedStories.length) % fixedStories.length;
            render();
        }

        function nextStory() {
            storyIndex = (storyIndex + 1) % fixedStories.length;
            render();
        }

        function renderPostCard(post, isModal = false) {
            const isAuthor = post.authorPhone === state.currentUser?.phone;
            const isAdmin = state.currentUser?.isEditor;
            const isLong = (post.content || '').length > 220;
            const displayText = isLong ? post.content.substring(0, 220) + '...' : (post.content || '');

            if (!post.reactions) post.reactions = { 'Masaallah': [], 'Dua Roilo': [], 'Innalillah': [] };
            const mCount = post.reactions['Masaallah']?.length || 0;
            const dCount = post.reactions['Dua Roilo']?.length || 0;
            const iCount = post.reactions['Innalillah']?.length || 0;
            const totalReactions = mCount + dCount + iCount;
            const myReaction = Object.keys(post.reactions).find(key => post.reactions[key].includes(state.currentUser?.phone));

            if (!post.comments) post.comments = [];
            const commentsToShow = isModal ? post.comments : post.comments.slice(-2);

            return `
                <div class="clean-card p-5 relative fade-in">
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex items-center space-x-3 cursor-pointer" onclick="viewUserProfile('${esc(post.authorPhone)}')">
                            <img src="${safeUrl(post.authorAvatar || getAutoAvatar())}" class="w-10 h-10 rounded-full border border-emerald-200 object-cover">
                            <div>
                                <h3 class="font-bold text-neutral-900 hover:text-emerald-700 text-sm">${esc(post.authorName)}</h3>
                                <div class="flex items-center space-x-2 text-[11px] text-neutral-500">
                                    <span class="bg-neutral-100 text-neutral-700 px-2 py-0.5 rounded font-medium">${esc(post.authorProfession)}</span>
                                    <span>•</span>
                                    <span>${timeAgo(post.createdAt, post.date)}${post.editedAt ? ' · সম্পাদিত' : ''}</span>
                                </div>
                            </div>
                        </div>
                        ${isAuthor || isAdmin ? `
                            <div class="relative">
                                <button onclick="togglePostMenu(event, '${esc(post.id)}')" class="text-neutral-400 hover:text-neutral-800 hover:bg-neutral-100 w-8 h-8 rounded-full flex items-center justify-center" aria-label="পোস্ট মেনু">
                                    <i class="fa-solid fa-ellipsis-vertical"></i>
                                </button>
                                <div id="pm-${esc(post.id)}" class="hidden absolute right-0 mt-1 w-32 bg-white border border-neutral-200 rounded-xl shadow-lg z-20 py-1 text-xs overflow-hidden">
                                    ${isAuthor ? `<button onclick="editPost('${esc(post.id)}')" class="w-full text-left px-3.5 py-2 hover:bg-neutral-100 text-neutral-800 flex items-center gap-2"><i class="fa-solid fa-pen w-3.5"></i> এডিট</button>` : ''}
                                    <button onclick="deletePost('${esc(post.id)}')" class="w-full text-left px-3.5 py-2 hover:bg-rose-50 text-rose-600 flex items-center gap-2"><i class="fa-solid fa-trash w-3.5"></i> ডিলিট</button>
                                </div>
                            </div>
                        ` : ''}
                    </div>

                    <div class="text-neutral-800 text-sm leading-relaxed mb-3.5 whitespace-pre-line">
                        <span>${esc(isModal ? post.content : displayText)}</span>
                        ${isLong && !isModal ? `<button onclick="openPostModal('${esc(post.id)}')" class="text-emerald-700 font-bold ml-1 hover:underline focus:outline-none text-xs">বিস্তারিত...</button>` : ''}
                    </div>

                    ${post.image ? `
                        <div class="mb-3.5 rounded-xl overflow-hidden border border-neutral-200 bg-neutral-100 max-h-80 flex items-center justify-center">
                            <img src="${safeUrl(post.image)}" alt="Post image" class="w-full object-cover max-h-80">
                        </div>
                    ` : ''}

                    <div class="flex items-center justify-between text-[11px] text-neutral-500 border-b border-neutral-100 pb-2 mb-2.5">
                        <div>
                            ${totalReactions > 0 ? `<span class="font-semibold text-emerald-700">🤲 ${bnNum(totalReactions)}টি প্রতিক্রিয়া</span>` : '<span>প্রতিক্রিয়া নেই</span>'}
                        </div>
                        <div class="space-x-2">
                            ${mCount > 0 ? `<span>মাশাআল্লাহ (${bnNum(mCount)})</span>` : ''}
                            ${dCount > 0 ? `<span>দোয়া রইলো (${bnNum(dCount)})</span>` : ''}
                            ${iCount > 0 ? `<span>ইন্নালিল্লাহ (${bnNum(iCount)})</span>` : ''}
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-2 border-b border-neutral-100 pb-3 mb-3">
                        <button onclick="toggleReaction('${esc(post.id)}', 'Masaallah')" class="py-1.5 px-2 rounded-xl text-xs font-semibold flex items-center justify-center space-x-1 transition ${myReaction === 'Masaallah' ? 'bg-emerald-50 text-emerald-800 border border-emerald-300' : 'bg-neutral-50 text-neutral-700 border border-neutral-200 hover:bg-neutral-100'}">
                            <span>🌿</span> <span>মাশাআল্লাহ</span>
                        </button>
                        <button onclick="toggleReaction('${esc(post.id)}', 'Dua Roilo')" class="py-1.5 px-2 rounded-xl text-xs font-semibold flex items-center justify-center space-x-1 transition ${myReaction === 'Dua Roilo' ? 'bg-emerald-50 text-emerald-800 border border-emerald-300' : 'bg-neutral-50 text-neutral-700 border border-neutral-200 hover:bg-neutral-100'}">
                            <span>🤲</span> <span>দোয়া রইলো</span>
                        </button>
                        <button onclick="toggleReaction('${esc(post.id)}', 'Innalillah')" class="py-1.5 px-2 rounded-xl text-xs font-semibold flex items-center justify-center space-x-1 transition ${myReaction === 'Innalillah' ? 'bg-emerald-50 text-emerald-800 border border-emerald-300' : 'bg-neutral-50 text-neutral-700 border border-neutral-200 hover:bg-neutral-100'}">
                            <span>🕊️</span> <span>ইন্নালিল্লাহ</span>
                        </button>
                    </div>

                    <div class="space-y-2.5">
                        <form onsubmit="handleComment(event, '${esc(post.id)}')" class="flex space-x-2">
                            <input type="text" id="comment-input-${esc(post.id)}" placeholder="মন্তব্য লিখুন..." class="flex-grow px-3 py-1.5 rounded-xl border border-neutral-200 focus:border-emerald-600 focus:outline-none text-xs">
                            <button type="submit" class="bg-neutral-900 hover:bg-neutral-800 text-white px-3.5 py-1.5 rounded-xl text-xs font-semibold transition">কমেন্ট</button>
                        </form>

                        <div class="space-y-1.5 mt-2">
                            ${commentsToShow.map(c => `
                                <div class="bg-neutral-50 px-3 py-2 rounded-xl border border-neutral-100 text-xs flex justify-between items-center">
                                    <div>
                                        <span class="font-bold text-neutral-900 mr-1.5 cursor-pointer hover:text-emerald-700 hover:underline" onclick="viewUserProfile('${esc(c.authorPhone)}')">${esc(c.authorName)}</span>
                                        <span class="text-neutral-700">${esc(c.text)}</span>
                                    </div>
                                    ${(c.authorPhone === state.currentUser.phone || isAuthor || isAdmin) ? `<button onclick="deleteComment('${esc(post.id)}', '${esc(c.id)}')" class="text-neutral-400 hover:text-rose-600 px-1" title="মন্তব্য মুছুন"><i class="fa-solid fa-xmark"></i></button>` : ''}
                                </div>
                            `).join('')}
                        </div>

                        ${!isModal && post.comments.length > 2 ? `
                            <div class="text-center pt-1">
                                <button onclick="openPostModal('${esc(post.id)}')" class="text-emerald-700 font-bold text-xs hover:underline">
                                    সব কমেন্ট দেখুন (${bnNum(post.comments.length)}টি) →
                                </button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        function renderNotifications() {
            const userNotifs = state.notifications.filter(n => n.recipientPhone === state.currentUser.phone);
            return `
                ${renderNavbar()}
                <main class="max-w-2xl mx-auto px-4 py-6 flex-grow w-full">
                    <div class="flex justify-between items-center mb-5">
                        <h2 class="text-xl font-bold text-neutral-900">বিজ্ঞপ্তি</h2>
                        ${userNotifs.length > 0 ? `
                            <button onclick="clearAllNotifications()" class="text-xs bg-neutral-200 text-neutral-800 px-3 py-1.5 rounded-xl font-semibold hover:bg-neutral-300 transition">সব মুছে ফেলুন</button>
                        ` : ''}
                    </div>

                    <div class="space-y-2.5">
                        ${userNotifs.length === 0 ? '<div class="clean-card p-8 text-center text-neutral-500 text-sm">কোনো বিজ্ঞপ্তি নেই।</div>' : ''}
                        ${userNotifs.map(n => `
                            <div class="clean-card p-3.5 ${n.isRead ? 'opacity-80' : 'border-emerald-300 bg-emerald-50/40'} flex justify-between items-center">
                                <div class="flex items-center space-x-3 cursor-pointer flex-grow" onclick="${n.postId ? `markAsReadAndOpen('${esc(n.id)}', '${esc(n.postId)}')` : `markAsRead('${esc(n.id)}')`}">
                                    <div class="w-9 h-9 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold flex-shrink-0">
                                        <i class="fa-solid fa-bell text-xs"></i>
                                    </div>
                                    <div>
                                        <p class="text-xs text-neutral-800">${esc(n.text)}</p>
                                        <span class="text-[10px] text-neutral-400">${timeAgo(n.createdAt, n.date)}</span>
                                    </div>
                                </div>
                                <div class="flex items-center space-x-2 flex-shrink-0 ml-2">
                                    ${!n.isRead ? `<button onclick="markAsRead('${esc(n.id)}')" class="text-[11px] bg-emerald-600 text-white px-2.5 py-1 rounded-lg font-semibold hover:bg-emerald-700 transition">পড়া হয়েছে</button>` : '<span class="text-[10px] text-neutral-400">পঠিত</span>'}
                                    <button onclick="deleteNotification('${esc(n.id)}')" class="text-neutral-400 hover:text-rose-600 p-1.5" title="মুছে ফেলুন"><i class="fa-solid fa-xmark"></i></button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </main>
            `;
        }

        function renderProfile(targetPhone = null) {
            const user = state.users.find(u => u.phone === (targetPhone || state.currentUser.phone)) || state.currentUser;
            const userPosts = state.posts.filter(p => p.authorPhone === user.phone);
            const isOwnProfile = user.phone === state.currentUser.phone;
            const currentEmail = isOwnProfile ? (auth.currentUser?.email || state.currentUser.email || '') : '';

            return `
                ${renderNavbar()}
                <main class="max-w-2xl mx-auto px-4 py-6 flex-grow w-full space-y-5">
                    <div class="clean-card p-6 text-center relative">
                        <img src="${safeUrl(user.profilePhoto)}" class="w-20 h-20 rounded-full mx-auto border-2 border-emerald-500 object-cover mb-3 bg-neutral-100">
                        <h2 class="text-xl font-bold text-neutral-900">${esc(user.name)}</h2>
                        <p class="text-xs text-neutral-500 mt-0.5">মোবাইল: ${esc(user.phone)}</p>
                        ${isOwnProfile && currentEmail ? `
                            <p class="text-xs text-neutral-700 mt-1 font-medium">
                                ইমেইল: <span class="text-emerald-700">${esc(currentEmail)}</span>
                            </p>
                        ` : ''}
                        <span class="inline-block bg-emerald-50 text-emerald-800 border border-emerald-200 text-xs px-3 py-0.5 rounded-full font-semibold mt-2">${esc(user.profession)}</span>

                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-5 pt-5 border-t border-neutral-100 text-center text-xs">
                            <div>
                                <span class="block text-[10px] text-neutral-400 font-semibold">বয়স</span>
                                <span class="font-bold text-neutral-900">${esc(user.age)} বছর</span>
                            </div>
                            <div>
                                <span class="block text-[10px] text-neutral-400 font-semibold">ঠিকানা</span>
                                <span class="font-bold text-neutral-900">${esc(user.location)}</span>
                            </div>
                            <div>
                                <span class="block text-[10px] text-neutral-400 font-semibold">এসএসসি ব্যাচ</span>
                                <span class="font-bold text-neutral-900">${esc(user.sscBatch)}</span>
                            </div>
                            <div>
                                <span class="block text-[10px] text-neutral-400 font-semibold">পোস্ট</span>
                                <span class="font-bold text-neutral-900">${bnNum(userPosts.length)}টি</span>
                            </div>
                        </div>

                        ${isOwnProfile ? `
                            <div class="mt-5 pt-4 border-t border-neutral-100 flex flex-wrap justify-center gap-2">
                                <button onclick="openEditProfileModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-xl text-xs font-semibold transition">
                                    <i class="fa-solid fa-pen-to-square mr-1"></i> প্রোফাইল এডিট
                                </button>
                                <button onclick="openChangeEmailModal()" class="bg-white hover:bg-emerald-50 text-emerald-800 border border-emerald-200 px-3 py-1.5 rounded-xl text-xs font-semibold transition">
                                    <i class="fa-solid fa-envelope mr-1"></i> ইমেইল পরিবর্তন
                                </button>
                                <button onclick="openChangePhotoModal()" class="bg-white hover:bg-neutral-100 text-neutral-800 border border-neutral-200 px-3 py-1.5 rounded-xl text-xs font-semibold transition">
                                    <i class="fa-solid fa-image mr-1"></i> ছবি পরিবর্তন
                                </button>
                                <button onclick="openChangePasswordModal()" class="bg-neutral-900 hover:bg-neutral-800 text-white px-3 py-1.5 rounded-xl text-xs font-semibold transition">
                                    <i class="fa-solid fa-key mr-1"></i> পাসওয়ার্ড পরিবর্তন
                                </button>
                            </div>
                        ` : ''}

                        ${state.currentUser.isEditor && !isOwnProfile ? `
                            <div class="mt-4 pt-4 border-t border-neutral-100 bg-neutral-50 p-3 rounded-xl text-xs text-neutral-800 flex justify-between items-center">
                                <span><strong>এডিটর নিয়ন্ত্রণ</strong></span>
                                <button onclick="adminDeleteUser('${esc(user.phone)}')" class="bg-rose-600 text-white px-3 py-1 rounded-lg font-bold hover:bg-rose-700">ইউজার ডিলিট</button>
                            </div>
                        ` : ''}
                    </div>

                    <h3 class="text-base font-bold text-neutral-900">${isOwnProfile ? 'আপনার পোস্টসমূহ' : `${esc(user.name)}-এর পোস্টসমূহ`} (${bnNum(userPosts.length)})</h3>
                    <div class="space-y-4">
                        ${userPosts.length === 0 ? '<p class="text-center text-neutral-500 py-6 clean-card text-sm">কোনো পোস্ট নেই।</p>' : ''}
                        ${userPosts.map(post => renderPostCard(post)).join('')}
                    </div>
                </main>
            `;
        }

        function renderAllMembers() {
            const q = (state.memberQuery || '').trim().toLowerCase();
            const visibleUsers = state.users.filter(u =>
                !q || [u.name, u.location, u.sscBatch, u.profession].join(' ').toLowerCase().includes(q)
            );

            return `
                ${renderNavbar()}
                <main class="max-w-2xl mx-auto px-4 py-6 flex-grow w-full">
                    <h2 class="text-xl font-bold mb-4 text-neutral-900">সকল সদস্য (${bnNum(visibleUsers.length)})</h2>
                    <input id="memberSearch" type="search" value="${esc(state.memberQuery || '')}" oninput="state.memberQuery = this.value; render()" placeholder="নাম, ঠিকানা, পেশা বা ব্যাচ দিয়ে খুঁজুন" class="w-full mb-4 px-4 py-2.5 rounded-xl border border-neutral-300 focus:border-emerald-600 focus:outline-none text-sm bg-white">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        ${visibleUsers.map(u => `
                            <div class="clean-card p-3.5 flex items-center justify-between">
                                <div class="flex items-center space-x-3 cursor-pointer min-w-0" onclick="viewUserProfile('${esc(u.phone)}')">
                                    <img src="${safeUrl(u.profilePhoto)}" class="w-11 h-11 rounded-full border border-neutral-200 object-cover flex-shrink-0">
                                    <div class="min-w-0">
                                        <h4 class="font-bold text-sm text-neutral-900 truncate">${esc(u.name)}</h4>
                                        <span class="text-[11px] text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded font-medium">${esc(u.profession)}</span>
                                        <p class="text-[11px] text-neutral-400 mt-0.5 truncate">ব্যাচ: ${esc(u.sscBatch)} | ${esc(u.location)}</p>
                                    </div>
                                </div>
                                <button onclick="viewUserProfile('${esc(u.phone)}')" class="bg-emerald-50 text-emerald-800 hover:bg-emerald-600 hover:text-white px-3 py-1.5 rounded-xl text-xs font-semibold transition border border-emerald-200 flex-shrink-0">প্রোফাইল</button>
                            </div>
                        `).join('')}
                    </div>
                </main>
            `;
        }

        function renderEditorPanel() {
            if (!state.currentUser?.isEditor) return renderFeed();
            const reactCount = p => Object.values(p.reactions || {}).reduce((a, r) => a + r.length, 0);
            const q = (state.adminQuery || '').trim().toLowerCase();
            const shownUsers = state.users.filter(u =>
                !q || [u.name, u.phone, u.sscBatch, u.location].join(' ').toLowerCase().includes(q)
            );
            const pop = state.popupConfig || { active: false, title: '', text: '', image: '' };

            return `
                ${renderNavbar()}
                <main class="max-w-3xl mx-auto px-4 py-6 flex-grow w-full space-y-5">
                    <h2 class="text-xl font-bold text-neutral-900 flex items-center gap-2">
                        <i class="fa-solid fa-sliders text-emerald-600"></i> এডিটর ও অ্যাডমিন প্যানেল
                    </h2>

                    <!-- সংক্ষিপ্ত পরিসংখ্যান -->
                    <div class="grid grid-cols-3 gap-3">

        // পপআপ উইন্ডো রেন্ডার (লগইন করার পর ফার্স্ট পেজে ছবিসহ শো করবে)
        function renderWelcomePopup() {
            if (!state.currentUser || state.currentView !== 'feed') return '';
            const pop = state.popupConfig;
            if (!pop || !pop.active) return '';
            const popId = pop.updatedAt || 'default_popup';
            if (state.popupDismissedId === popId) return '';

            return `
                <div id="welcomePopupOverlay" class="fixed inset-0 bg-neutral-900/60 backdrop-blur-xs z-[70] flex items-center justify-center p-4">
                    <div class="bg-white border border-neutral-200 rounded-2xl max-w-md w-full overflow-hidden shadow-2xl fade-in relative">
                        <button onclick="dismissWelcomePopup('${esc(popId)}')" aria-label="বন্ধ করুন" class="absolute top-3 right-3 z-10 w-8 h-8 rounded-full bg-white/90 hover:bg-white text-neutral-800 border border-neutral-200 flex items-center justify-center shadow-sm">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                        ${pop.image ? `
                            <div class="w-full max-h-60 bg-neutral-100 overflow-hidden border-b border-neutral-100">
                                <img src="${safeUrl(pop.image)}" alt="Popup image" class="w-full h-56 object-cover">
                            </div>
                        ` : ''}
                        <div class="p-5">
                            <div class="inline-flex items-center gap-1.5 text-[11px] font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 px-2.5 py-0.5 rounded-full mb-2">
                                <i class="fa-solid fa-bullhorn"></i> ঘোষণা
                            </div>
                            ${pop.title ? `<h3 class="text-lg font-bold text-neutral-900 mb-1.5">${esc(pop.title)}</h3>` : ''}
                            ${pop.text ? `<p class="text-sm text-neutral-700 leading-relaxed whitespace-pre-line mb-4">${esc(pop.text)}</p>` : ''}
                            <button onclick="dismissWelcomePopup('${esc(popId)}')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-xs transition">
                                ঠিক আছে, বন্ধ করুন
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function dismissWelcomePopup(popId) {
            state.popupDismissedId = popId;
            render();
        }

        function previewPopupNow() {
            state.popupDismissedId = null;
            state.currentView = 'feed';
            render();
        }

        async function handleSavePopupConfig(event) {
            event.preventDefault();
            if (!state.currentUser?.isEditor) return;
            const title = document.getElementById('popupTitle').value.trim();
            const image = document.getElementById('popupImage').value.trim();
            const text = document.getElementById('popupText').value.trim();
            const active = document.getElementById('popupActive').checked;

            if (active && !title && !text && !image) {
                showToast('পপআপ চালু করতে অন্তত শিরোনাম, ছবি বা বার্তা দিন!', true);
                return;
            }

            const payload = {
                title,
                image,
                text,
                active,
                updatedAt: 'pop_' + Date.now()
            };

            try {
                await db.collection('config').doc('popup').set(payload);
                state.popupConfig = payload;
                state.popupDismissedId = null;
                showToast(active ? 'পপআপ উইন্ডো চালু ও সেভ হয়েছে!' : 'পপআপ উইন্ডো বন্ধ করা হয়েছে।');
                render();
            } catch (e) {
                showToast('পপআপ সেভ করা যায়নি। আবার চেষ্টা করুন।', true);
            }
        }

            if (!state.activeModalPostId) return '';

            if (!post) return '';

            return `

                    <div class="bg-white border border-neutral-200 rounded-2xl max-w-xl w-full max-h-[90vh] overflow-y-auto p-5 relative shadow-xl">

                        </button>

        }

        // প্রোফাইল ইমেইল পরিবর্তন মডাল
        function openChangeEmailModal() {
            const old = document.getElementById('changeEmailModal');
            if (old) old.remove();
            const currentEmail = auth.currentUser?.email || state.currentUser.email || '';
            const div = document.createElement('div');
            div.id = 'changeEmailModal';
            div.className = 'fixed inset-0 bg-neutral-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4';
            div.innerHTML = `
                <div class="bg-white border border-neutral-200 rounded-2xl max-w-md w-full p-6 relative shadow-xl fade-in">
                    <button onclick="closeModalById('changeEmailModal')" class="absolute top-4 right-4 text-neutral-500 hover:text-neutral-900 w-8 h-8 rounded-full bg-neutral-100 flex items-center justify-center font-bold">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                    <h3 class="text-base font-bold text-neutral-900 mb-1">ইমেইল পরিবর্তন করুন</h3>
                    <p class="text-xs text-neutral-500 mb-4">বর্তমান ইমেইল: <strong>${esc(currentEmail)}</strong></p>
                    <form onsubmit="handleUpdateEmail(event)" class="space-y-3">
                        <div>
                            <label class="block text-xs font-semibold text-neutral-700 mb-1">নতুন ইমেইল ঠিকানা</label>
                            <input type="email" id="newEmailInput" required placeholder="newemail@example.com" class="w-full p-2.5 rounded-xl border border-neutral-300 text-sm focus:border-emerald-600 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-neutral-700 mb-1">বর্তমান পাসওয়ার্ড (নিরাপত্তার জন্য)</label>
                            <input type="password" id="emailConfirmPassword" required placeholder="••••••••" class="w-full p-2.5 rounded-xl border border-neutral-300 text-sm focus:border-emerald-600 focus:outline-none">
                        </div>
                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-xl font-bold text-xs">ইমেইল আপডেট করুন</button>
                    </form>
                </div>
            `;
            document.body.appendChild(div);
        }

        async function handleUpdateEmail(event) {
            event.preventDefault();
            const newEmail = document.getElementById('newEmailInput').value.trim().toLowerCase();
            const currentPass = document.getElementById('emailConfirmPassword').value;
            const user = auth.currentUser;
            if (!user || !newEmail || !currentPass) return;

            if (newEmail === (user.email || '').toLowerCase()) {
                showToast('নতুন ইমেইল এবং বর্তমান ইমেইল একই!', true);
                return;
            }

            try {
                const cred = firebase.auth.EmailAuthProvider.credential(user.email, currentPass);
                await user.reauthenticateWithCredential(cred);
                await user.updateEmail(newEmail);

                // Firestore phones ম্যাপিং আপডেট যাতে মোবাইল দিয়েও নতুন ইমেইলে লগইন করা যায়
                const phoneKey = state.currentUser.phone.replace('+', '');
                await db.collection('phones').doc(phoneKey).set({
                    uid: user.uid,
                    email: newEmail
                }, { merge: true }).catch(() => {});

                state.currentUser.email = newEmail;
                closeModalById('changeEmailModal');
                showToast('আপনার ইমেইল সফলভাবে পরিবর্তন হয়েছে!');
                render();
            } catch (e) {
                const msg = {
                    'auth/wrong-password': 'বর্তমান পাসওয়ার্ড ভুল হয়েছে!',
                    'auth/invalid-credential': 'বর্তমান পাসওয়ার্ড ভুল হয়েছে!',
                    'auth/email-already-in-use': 'এই ইমেইলটি অন্য একাউন্টে ব্যবহৃত হচ্ছে!',
                    'auth/invalid-email': 'সঠিক ইমেইল ঠিকানা দিন!',
                    'auth/operation-not-allowed': 'ফায়ারবেস কনসোলে সরাসরি ইমেইল পরিবর্তন সক্রিয় থাকতে হবে।'
                };
                showToast(msg[e.code] || 'ইমেইল পরিবর্তন করা যায়নি। আবার চেষ্টা করুন।', true);
            }
        }

            document.body.appendChild(div);

        async function handleUpdatePhoto(event) {
            event.preventDefault();

            if (!url) return;
            state.currentUser.profilePhoto = url;
            const u = state.users.find(x => x.phone === state.currentUser.phone);
            if (u) u.profilePhoto = url;
            await saveDataToCloud();
            closeModalById('changePhotoModal');
            showToast('প্রোফাইল ছবি আপডেট হয়েছে!');
            render();

            div.innerHTML = `
                <div class="bg-white border border-neutral-200 rounded-2xl max-w-md w-full p-6 relative shadow-xl fade-in">
                    <button onclick="closeModalById('changePassModal')" class="absolute top-4 right-4 text-neutral-500 hover:text-neutral-900 w-8 h-8 rounded-full bg-neutral-100 flex items-center justify-center font-bold">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                    <h3 class="text-base font-bold text-neutral-900 mb-3">পাসওয়ার্ড পরিবর্তন</h3>
                    <form onsubmit="handleUpdatePassword(event)" class="space-y-3">
                        <input type="password" id="curPassInput" required placeholder="বর্তমান পাসওয়ার্ড" class="w-full p-2.5 rounded-xl border border-neutral-300 text-sm">
                        <input type="password" id="newPassInput" required minlength="6" placeholder="নতুন পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)" class="w-full p-2.5 rounded-xl border border-neutral-300 text-sm">
                        <button type="submit" class="w-full bg-neutral-900 hover:bg-neutral-800 text-white py-2.5 rounded-xl font-bold text-xs">পাসওয়ার্ড পরিবর্তন করুন</button>
                    </form>
                </div>
            `;
            document.body.appendChild(div);
        }

        async function handleUpdatePassword(event) {
            event.preventDefault();
            const cur = document.getElementById('curPassInput').value;
            const np = document.getElementById('newPassInput').value.trim();
            try {
                const cred = firebase.auth.EmailAuthProvider.credential(auth.currentUser.email, cur);
                await auth.currentUser.reauthenticateWithCredential(cred);
                await auth.currentUser.updatePassword(np);
                closeModalById('changePassModal');
                showToast('পাসওয়ার্ড সফলভাবে পরিবর্তন হয়েছে!');
            } catch (e) {
                showToast('বর্তমান পাসওয়ার্ড ভুল বা পরিবর্তন সম্ভব হয়নি।', true);
            }
        }

        function closeModalById(id) {
            const m = document.getElementById(id);
            if (m) m.remove();
        }

        function switchView(view) {
            state.currentView = view;
            state.activeModalPostId = null;
            state.viewingProfilePhone = null;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // সরাসরি সাইনআপ (কোনো ইমেইল ভেরিফিকেশন ছাড়াই)
        async function handleSignup(event) {
            event.preventDefault();
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim().toLowerCase();
            const password = document.getElementById('signupPassword').value;
            const rawPhone = document.getElementById('signupPhone').value.trim();
            const profession = document.getElementById('signupProfession').value;
            const age = document.getElementById('signupAge').value;
            const location = document.getElementById('signupLocation').value.trim();
            const sscBatch = document.getElementById('signupBatch').value.trim();

            if (!email) { showToast('ইমেইল আবশ্যক!', true); return; }
            if (password.length < 6) { showToast('পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে!', true); return; }
            if (!/^1[0-9]{9}$/.test(rawPhone)) { showToast('মোবাইল নম্বর 1 দিয়ে শুরু ১০ ডিজিটের হতে হবে!', true); return; }
            if (!/^[0-9]{4}$/.test(sscBatch)) { showToast('এসএসসি ব্যাচ ৪ ডিজিটের হতে হবে!', true); return; }
            if (await lookupEmail(rawPhone)) { showToast('এই মোবাইল নম্বরে ইতিমধ্যে একটি আইডি আছে!', true); return; }

            const phone = '+880' + rawPhone;
            state.signingUp = true;

            let cred;
            try {
                cred = await auth.createUserWithEmailAndPassword(email, password);
            } catch (e) {
                state.signingUp = false;
                const msg = {
                    'auth/email-already-in-use': 'এই ইমেইল ইতিমধ্যে ব্যবহৃত হয়েছে!',
                    'auth/invalid-email': 'সঠিক ইমেইল ঠিকানা দিন!',
                    'auth/weak-password': 'পাসওয়ার্ড আরও শক্তিশালী দিন!'
                };
                showToast(msg[e.code] || 'একাউন্ট তৈরি করা যায়নি, আবার চেষ্টা করুন।', true);
                return;
            }

            const uid = cred.user.uid;
            const profile = {
                uid,
                name,
                phone,
                profession,
                age,
                location,
                sscBatch,
                profilePhoto: getAutoAvatar()
            };

            try {
                const b = db.batch();
                b.set(db.collection('phones').doc('880' + rawPhone), { uid, email });
                b.set(db.collection('users').doc(uid), profile);
                await b.commit();

                const nid = 'n_' + Date.now();
                await db.collection('notifications').doc(nid).set({
                    id: nid,
                    recipientPhone: phone,
                    text: 'উঠান পরিবারে আপনাকে স্বাগতম!',
                    isRead: false,
                    isEditorBroadcast: false,
                    date: 'এইমাত্র',
                    createdAt: Date.now()
                }).catch(() => {});

                state.signingUp = false;
                state.users.push(profile);
                applyMe();
                showToast('সাইনআপ সফল হয়েছে! স্বাগতম।');
                render();
            } catch (e) {
                state.signingUp = false;
                await cred.user.delete().catch(() => {});
                showToast('একাউন্ট তৈরি করা যায়নি, আবার চেষ্টা করুন।', true);
            }
        }

        async function lookupEmail(rawPhone) {
            try {
                const d = await db.collection('phones').doc('880' + rawPhone).get();
                return d.exists ? d.data().email : null;
            } catch (e) { return null; }
        }

        function parseLoginId(v) {
            v = v.trim().replace(/\s+/g, '');
            if (v.includes('@')) return { email: v.toLowerCase() };
            const m = v.match(/^(?:\+?880|0)?(1[0-9]{9})$/);
            return m ? { phone: m[1] } : null;
        }

        async function handleLogin(event) {
            event.preventDefault();
            const id = parseLoginId(document.getElementById('loginPhone').value);
            const password = document.getElementById('loginPassword').value;
            if (!id) { showToast('সঠিক ইমেইল বা মোবাইল নম্বর দিন!', true); return; }
            const email = id.email || await lookupEmail(id.phone);
            try {
                if (!email) throw new Error('no-user');
                await auth.signInWithEmailAndPassword(email, password);
            } catch (e) {
                showToast('ইমেইল/মোবাইল অথবা পাসওয়ার্ড ভুল হয়েছে!', true);
            }
        }

        function logout() {
            stopListeners();
            auth.signOut().catch(() => {});
            state.currentUser = null;
            state.popupDismissedId = null;
            switchView('login');
        }

        function recoverPasswordPrompt() {
            const old = document.getElementById('recoverModal');
            if (old) old.remove();
            const div = document.createElement('div');
            div.id = 'recoverModal';
            div.className = 'fixed inset-0 bg-neutral-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4';
            div.innerHTML = `
                <div class="bg-white border border-neutral-200 rounded-2xl max-w-sm w-full p-6 relative shadow-xl fade-in">
                    <button onclick="closeModalById('recoverModal')" class="absolute top-4 right-4 text-neutral-500 hover:text-neutral-900 w-8 h-8 rounded-full bg-neutral-100 flex items-center justify-center font-bold">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                    <h3 class="text-base font-bold text-neutral-900 mb-2">পাসওয়ার্ড পুনরুদ্ধার</h3>
                    <p class="text-xs text-neutral-500 mb-3">আপনার একাউন্টের ইমেইল বা মোবাইল নম্বর দিন:</p>
                    <form onsubmit="handleRecoverSubmit(event)" class="space-y-3">
                        <input type="text" id="recoverIdInput" required placeholder="name@example.com অথবা 017..." class="w-full p-2.5 rounded-xl border border-neutral-300 text-sm">
                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-xl font-bold text-xs">রিসেট লিংক পাঠান</button>
                    </form>
                </div>
            `;
            document.body.appendChild(div);
        }

        async function handleRecoverSubmit(event) {
            event.preventDefault();
            const raw = document.getElementById('recoverIdInput').value;
            const id = parseLoginId(raw);
            if (!id) { showToast('সঠিক ইমেইল বা মোবাইল নম্বর দিন!', true); return; }
            const email = id.email || await lookupEmail(id.phone);
            if (email) { try { await auth.sendPasswordResetEmail(email); } catch (e) {} }
            closeModalById('recoverModal');
            showToast('একাউন্ট থাকলে ইমেইলে পাসওয়ার্ড রিসেট লিংক পাঠানো হয়েছে।');
        }

        async function handleCreatePost(event) {
            event.preventDefault();
            const content = document.getElementById('postContent').value.trim();
            const image = document.getElementById('postImage').value.trim();
            if (!content && !image) return;

            const newPost = {
                id: 'p_' + Date.now(),
                authorPhone: state.currentUser.phone,
                authorName: state.currentUser.name,
                authorProfession: state.currentUser.profession,
                authorAvatar: state.currentUser.profilePhoto,
                content,
                image,
                date: 'এইমাত্র',
                createdAt: Date.now(),
                reactions: { 'Masaallah': [], 'Dua Roilo': [], 'Innalillah': [] },
                comments: []
            };

            state.posts.unshift(newPost);
            document.getElementById('postContent').value = '';
            document.getElementById('postImage').value = '';
            render();
            await saveDataToCloud();
        }

        function togglePostMenu(e, id) {
            e.stopPropagation();
            document.querySelectorAll('[id^="pm-"]').forEach(m => { if (m.id !== 'pm-' + id) m.classList.add('hidden'); });
            const m = document.getElementById('pm-' + id);
            if (m) m.classList.toggle('hidden');
        }

        window.addEventListener('click', () => document.querySelectorAll('[id^="pm-"]').forEach(m => m.classList.add('hidden')));

        function editPost(postId) {
            const post = state.posts.find(p => p.id === postId);
            if (!post || post.authorPhone !== state.currentUser.phone) return;
            closeModalById('editPostModal');
            const div = document.createElement('div');
            div.id = 'editPostModal';
            div.className = 'fixed inset-0 bg-neutral-900/60 backdrop-blur-xs z-[60] flex items-center justify-center p-4';
            div.innerHTML = `
                <div class="bg-white border border-neutral-200 rounded-2xl max-w-lg w-full p-6 shadow-xl fade-in">
                    <h3 class="text-base font-bold text-neutral-900 mb-3">পোস্ট এডিট করুন</h3>
                    <textarea id="editPostText" rows="5" maxlength="5000" class="w-full p-3 rounded-xl border border-neutral-300 focus:border-emerald-600 focus:outline-none text-sm"></textarea>
                    <input id="editPostImage" type="text" placeholder="ছবির লিংক (ঐচ্ছিক)" class="w-full mt-3 px-3 py-2 rounded-xl border border-neutral-300 text-xs focus:border-emerald-600 focus:outline-none">
                    <div class="flex justify-end gap-2 mt-4">
                        <button onclick="closeModalById('editPostModal')" class="px-4 py-2 rounded-xl bg-neutral-100 hover:bg-neutral-200 text-xs font-semibold">বাতিল</button>
                        <button onclick="saveEditedPost('${esc(post.id)}')" class="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold">সংরক্ষণ</button>
                    </div>
                </div>`;
            document.body.appendChild(div);
            document.getElementById('editPostText').value = post.content || '';
            document.getElementById('editPostImage').value = post.image || '';
        }

        async function saveEditedPost(postId) {
            const post = state.posts.find(p => p.id === postId);
            if (!post) return;
            const content = document.getElementById('editPostText').value.trim();
            const image = document.getElementById('editPostImage').value.trim();
            if (!content && !image) { showToast('পোস্ট ফাঁকা রাখা যাবে না!', true); return; }
            post.content = content;
            post.image = image;
            post.editedAt = Date.now();
            closeModalById('editPostModal');
            render();
            await saveDataToCloud();
        }

        function deletePost(postId) {
            showConfirmModal('আপনি কি নিশ্চিত এই পোস্টটি ডিলিট করতে চান?', async () => {
                state.activeModalPostId = null;
                state.posts = state.posts.filter(p => p.id !== postId);
                render();
                await saveDataToCloud();
                showToast('পোস্ট ডিলিট হয়েছে।');
            });
        }

        async function toggleReaction(postId, reactionType) {
            const post = state.posts.find(p => p.id === postId);
            if (!post) return;
            const alreadySelected = post.reactions[reactionType].includes(state.currentUser.phone);
            Object.keys(post.reactions).forEach(type => {
                post.reactions[type] = post.reactions[type].filter(phone => phone !== state.currentUser.phone);
            });
            if (!alreadySelected) post.reactions[reactionType].push(state.currentUser.phone);
            render();
            await saveDataToCloud();
        }

        async function handleComment(event, postId) {
            event.preventDefault();
            const input = document.getElementById(`comment-input-${postId}`);
            const text = input.value.trim();
            if (!text) return;
            const post = state.posts.find(p => p.id === postId);
            if (!post) return;

            post.comments.push({
                id: 'c_' + Date.now(),
                authorPhone: state.currentUser.phone,
                authorName: state.currentUser.name,
                text
            });

            if (post.authorPhone !== state.currentUser.phone) {
                state.notifications.unshift({
                    id: 'n_' + Date.now(),
                    recipientPhone: post.authorPhone,
                    postId: post.id,
                    text: `${state.currentUser.name} আপনার পোস্টে মন্তব্য করেছেন।`,
                    isRead: false,
                    isEditorBroadcast: false,
                    date: 'এইমাত্র',
                    createdAt: Date.now()
                });
            }

            input.value = '';
            render();
            if (state.activeModalPostId) state.activeModalPostId = postId;
            await saveDataToCloud();
        }

        function deleteComment(postId, commentId) {
            const post = state.posts.find(p => p.id === postId);
            if (!post) return;
            showConfirmModal('মন্তব্যটি মুছে ফেলবেন?', async () => {
                post.comments = (post.comments || []).filter(c => c.id !== commentId);
                render();
                await saveDataToCloud();
            });
        }

        async function clearAllNotifications() {
            state.notifications = state.notifications.filter(n => n.recipientPhone !== state.currentUser.phone);
            render();
            await saveDataToCloud();
        }

        async function deleteNotification(notifId) {
            state.notifications = state.notifications.filter(n => n.id !== notifId);
            render();
            await saveDataToCloud();
        }

        async function markAsRead(notifId) {
            const notif = state.notifications.find(n => n.id === notifId);
            if (notif) {
                notif.isRead = true;
                render();
                await saveDataToCloud();
            }
        }

        function markAsReadAndOpen(notifId, postId) {
            markAsRead(notifId);
            openPostModal(postId);
        }

        function openPostModal(postId) {
            state.activeModalPostId = postId;
            render();
        }

        function closePostModal() {
            state.activeModalPostId = null;
            render();
        }

        function viewMyProfile() {
            state.viewingProfilePhone = state.currentUser.phone;
            state.currentView = 'profile';
            render();
        }

        function viewUserProfile(phone) {
            state.viewingProfilePhone = phone;
            state.currentView = 'profile';
            render();
        }

        async function handleUpdateProfile(event) {
            event.preventDefault();
            const sscBatch = document.getElementById('editBatch').value.trim();
            if (!/^[0-9]{4}$/.test(sscBatch)) { showToast('এসএসসি ব্যাচ ৪ ডিজিটের হতে হবে!', true); return; }

            state.currentUser.name = document.getElementById('editName').value.trim();
            state.currentUser.age = document.getElementById('editAge').value.trim();
            state.currentUser.location = document.getElementById('editLocation').value.trim();
            state.currentUser.sscBatch = sscBatch;

            const u = state.users.find(x => x.phone === state.currentUser.phone);
            if (u) {
                u.name = state.currentUser.name;
                u.age = state.currentUser.age;
                u.location = state.currentUser.location;
                u.sscBatch = state.currentUser.sscBatch;
            }

            closeModalById('editProfileModal');
            render();
            await saveDataToCloud();
            showToast('প্রোফাইল আপডেট হয়েছে!');
        }

        function adminDeleteUser(phone) {
            showConfirmModal(`এই ইউজার (${phone}) এবং তার পোস্ট মুছে ফেলবেন?`, async () => {
                db.collection('phones').doc(phone.replace('+', '')).delete().catch(() => {});
                state.users = state.users.filter(u => u.phone !== phone);
                state.posts = state.posts.filter(p => p.authorPhone !== phone);
                await saveDataToCloud();
                showToast('ইউজার ডিলিট করা হয়েছে।');
                switchView('all_members');
            });
        }

        async function handleEditorBroadcast(event) {
            event.preventDefault();
            const target = document.getElementById('broadcastTarget').value;
            const text = document.getElementById('broadcastText').value.trim();
            if (!text) return;

            if (target === 'ALL') {
                state.users.forEach(u => {
                    state.notifications.unshift({
                        id: 'nb_' + Date.now() + '_' + u.phone,
                        recipientPhone: u.phone,
                        text: `[অ্যাডমিন ঘোষণা]: ${text}`,
                        isRead: false,
                        isEditorBroadcast: true,
                        date: 'এইমাত্র',
                        createdAt: Date.now()
                    });
                });
            } else {
                state.notifications.unshift({
                    id: 'nb_' + Date.now(),
                    recipientPhone: target,
                    text: `[অ্যাডমিন বার্তা]: ${text}`,
                    isRead: false,
                    isEditorBroadcast: true,
                    date: 'এইমাত্র',
                    createdAt: Date.now()
                });
            }

            document.getElementById('broadcastText').value = '';
            await saveDataToCloud();
            showToast('বিজ্ঞপ্তি পাঠানো হয়েছে!');
            render();
        }

        function render() {
            const app = document.getElementById('app');
            if (!state.authReady) {
                app.innerHTML = '<div class="min-h-screen flex items-center justify-center text-neutral-500 text-sm">লোড হচ্ছে...</div>';
                return;
            }

            let contentHTML = '';
            if (!state.currentUser) {
                contentHTML = state.currentView === 'signup' ? renderSignup() : renderLogin();
            } else {
                switch (state.currentView) {
                    case 'feed': contentHTML = renderFeed(); break;
                    case 'notifications': contentHTML = renderNotifications(); break;
                    case 'profile': contentHTML = renderProfile(state.viewingProfilePhone); break;
                    case 'all_members': contentHTML = renderAllMembers(); break;
                    case 'editor_panel': contentHTML = renderEditorPanel(); break;
                    default: contentHTML = renderFeed();
                }
            }

            contentHTML += renderPostModal();
            contentHTML += renderWelcomePopup();

            const saved = {};
            app.querySelectorAll('#postContent, #postImage, [id^="comment-input-"]').forEach(el => {
                if (el.value) saved[el.id] = el.value;
            });
            const a = document.activeElement;
            const focusId = a && app.contains(a) ? a.id : null;
            const pos = a ? a.selectionStart : null;

            app.innerHTML = contentHTML;

            Object.keys(saved).forEach(id => {
                const el = document.getElementById(id);
                if (el && !el.value) el.value = saved[id];
            });
            if (focusId) {
                const el = document.getElementById(focusId);
                if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} }
            }
        }
    </script>
</body>
</html>
