<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uthan - বাংলা সোশ্যাল সাইট (Cloud Live)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-stone-50 text-stone-800 font-sans antialiased min-h-screen pb-12">

    <div id="app" class="min-h-screen flex flex-col"></div>

    <script>
        // TODO: আপনার ফায়ারবেস কনসোল থেকে পাওয়া কনফিগারেশন এখানে বসান
       const firebaseConfig = {
  apiKey: "AIzaSyCwxTRS9qV4E_SKNcDbwZhpAbmt9lzTTB0",
  authDomain: "uthan-app.firebaseapp.com",
  databaseURL: "https://uthan-app-default-rtdb.firebaseio.com",
  projectId: "uthan-app",
  storageBucket: "uthan-app.firebasestorage.app",
  messagingSenderId: "38539464818",
  appId: "1:38539464818:web:8518def23c53c3ec5ff2eb",
  measurementId: "G-WVRJNJBVTY"
};

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const professions = [
            "কৃষক (Farmer)", "ছাত্র (Student)", "শিক্ষক (Teacher)", "প্রকৌশলী (Engineer)", 
            "ডাক্তার (Doctor)", "ব্যবসায়ী (Business)", "প্রবাসী (Expatriate)", "চাকরিজীবী (Service Holder)"
        ];

        function getAutoAvatar(profession) {
            return `https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcScWiAVhPvL7XWofFEbi_wjPv1XMyY4Mqis9j4XgowoLg&s=10`;
        }

        let fixedStories = [
            { id: 'st1', title: 'আজকের তারিখ', text: 'ইংরেজি: ১৯ নভেম্বর ২০২৬ | বাংলা: ৪ অগ্রহায়ণ ১৪৩৩ | আরবি: ৮ জমাদিউল উলা ১৪৪৮ হিজরি।' },
            { id: 'st2', title: 'আজকের কুরআন আয়াত', text: '"তোমরা ধৈর্য ও সালাতের মাধ্যমে সাহায্য প্রার্থনা করো।" (সুরা বাকারা: ৪৫)' },
            { id: 'st3', title: 'আজকের হাদিস', text: '"তোমাদের মধ্যে সেই ব্যক্তি উত্তম, যে নিজে কুরআন শেখে এবং অপরকে শেখায়।" (বুখারি)' },
            { id: 'st4', title: 'বাংলার প্রবাদ', text: '"চরে খাওয়া মানুষের মনে অহংকার থাকে না, পরিশ্রমই তাদের বড় পুঁজি।"' },
            { id: 'st5', title: 'সর্বশেষ সংবাদ', text: 'ক্লাউড রিয়েল-টাইম সার্ভার সিঙ্ক সক্রিয় রয়েছে।' }
        ];

        let storyIndex = 0;

        let state = {
            currentUser: JSON.parse(localStorage.getItem('uthan_current_user')) || null,
            users: [],
            posts: [],
            notifications: [],
            currentView: JSON.parse(localStorage.getItem('uthan_current_user')) ? 'feed' : 'login',
            activeModalPostId: null,
            viewingProfilePhone: null
        };

        // --- Cloud Firestore Sync Functions ---
        async function saveDataToCloud() {
            try {
                await db.collection('uthan_db').doc('main_state').set({
                    users: state.users,
                    posts: state.posts,
                    notifications: state.notifications,
                    stories: fixedStories
                });
                localStorage.setItem('uthan_current_user', JSON.stringify(state.currentUser));
            } catch (error) {
                console.error("Cloud Save Error: ", error);
            }
        }

        async function loadDataFromCloud() {
            try {
                const doc = await db.collection('uthan_db').doc('main_state').get();
                if (doc.exists) {
                    const data = doc.data();
                    state.users = data.users || [];
                    state.posts = data.posts || [];
                    state.notifications = data.notifications || [];
                    if(data.stories) fixedStories = data.stories;
                } else {
                    // Default Admin if database empty
                    state.users = [{
                        name: 'অ্যাডমিন মহোদয়',
                        phone: '+8801770334681',
                        profession: 'চাকরিজীবী (Service Holder)',
                        age: '32',
                        location: 'ঢাকা',
                        sscBatch: '2010',
                        password: '1',
                        profilePhoto: getAutoAvatar('Service Holder'),
                        isEditor: true
                    }];
                    await saveDataToCloud();
                }
                render();
            } catch (error) {
                console.error("Cloud Load Error: ", error);
                render();
            }
        }

        // Realtime Listener for Live Sync across all users
        db.collection('uthan_db').doc('main_state').onSnapshot((doc) => {
            if (doc.exists) {
                const data = doc.data();
                state.users = data.users || state.users;
                state.posts = data.posts || state.posts;
                state.notifications = data.notifications || state.notifications;
                if(data.stories) fixedStories = data.stories;
                
                // Keep current user updated
                if (state.currentUser) {
                    const updatedMe = state.users.find(u => u.phone === state.currentUser.phone);
                    if (updatedMe) state.currentUser = updatedMe;
                }
                render();
            }
        });

        function renderNavbar() {
            if (!state.currentUser) return '';
            const unreadCount = state.notifications.filter(n => n.recipientPhone === state.currentUser.phone && !n.isRead).length;

            return `
                <header class="bg-emerald-800 text-white shadow-md sticky top-0 z-50">
                    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
                        <div class="cursor-pointer" onclick="switchView('feed')">
                            <span class="text-2xl font-bold tracking-wider font-serif">উঠান</span>
                        </div>
                        <div class="flex items-center space-x-6 text-sm font-medium">
                            <button onclick="switchView('feed')" class="transition flex items-center space-x-1 py-1 ${state.currentView === 'feed' ? 'border-b-2 border-white font-bold' : 'hover:text-emerald-200'}">
                                <i class="fa-solid fa-newspaper text-lg"></i> <span class="hidden sm:inline">ফিড</span>
                            </button>
                            <button onclick="switchView('notifications')" class="transition relative flex items-center space-x-1 py-1 ${state.currentView === 'notifications' ? 'border-b-2 border-white font-bold' : 'hover:text-emerald-200'}">
                                <i class="fa-solid fa-bell text-lg"></i> <span class="hidden sm:inline">বিজ্ঞপ্তি</span>
                                ${unreadCount > 0 ? `<span class="absolute -top-1 -right-2 bg-rose-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">${unreadCount}</span>` : ''}
                            </button>
                            <div class="relative">
                                <button onclick="toggleSubmenu(event)" class="flex items-center space-x-2 focus:outline-none py-1">
                                    <img src="${state.currentUser.profilePhoto}" alt="Profile" class="w-9 h-9 rounded-full border-2 border-emerald-300 object-cover bg-white">
                                    <i class="fa-solid fa-angle-down text-xs"></i>
                                </button>
                                <div id="navSubmenu" class="absolute right-0 mt-2 w-48 bg-white text-stone-800 rounded-lg shadow-2xl py-2 hidden border border-stone-200 z-50">
                                    <button onclick="viewMyProfile()" class="w-full text-left px-4 py-2 hover:bg-emerald-50 hover:text-emerald-700 flex items-center space-x-2">
                                        <i class="fa-solid fa-user text-emerald-600 w-5"></i> <span>প্রোফাইল</span>
                                    </button>
                                    <button onclick="switchView('all_members')" class="w-full text-left px-4 py-2 hover:bg-emerald-50 hover:text-emerald-700 flex items-center space-x-2">
                                        <i class="fa-solid fa-users text-emerald-600 w-5"></i> <span>সকল সদস্য</span>
                                    </button>
                                    ${state.currentUser.isEditor ? `
                                        <button onclick="switchView('editor_panel')" class="w-full text-left px-4 py-2 hover:bg-amber-50 hover:text-amber-700 flex items-center space-x-2 border-t border-stone-100">
                                            <i class="fa-solid fa-shield-halved text-amber-600 w-5"></i> <span>অ্যাডমিন প্যানেল</span>
                                        </button>
                                    ` : ''}
                                    <div class="border-t border-stone-100 my-1"></div>
                                    <button onclick="logout()" class="w-full text-left px-4 py-2 hover:bg-rose-50 hover:text-rose-600 flex items-center space-x-2">
                                        <i class="fa-solid fa-right-from-bracket text-rose-500 w-5"></i> <span>লগ আউট</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </header>
            `;
        }

        function toggleSubmenu(e) {
            e.stopPropagation();
            const menu = document.getElementById('navSubmenu');
            if (menu) menu.classList.toggle('hidden');
        }

        window.addEventListener('click', () => {
            const menu = document.getElementById('navSubmenu');
            if (menu && !menu.classList.contains('hidden')) menu.classList.add('hidden');
        });

        function renderLogin() {
            return `
                <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-emerald-800 to-teal-900 px-4 py-12">
                    <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 border border-emerald-100">
                        <div class="text-center mb-8">
                            <h1 class="text-4xl font-bold text-emerald-800 font-serif mb-2">উঠান</h1>
                            <p class="text-stone-500 text-sm">বাংলা সোশ্যাল সাইট</p>
                        </div>
                        <form onsubmit="handleLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase text-stone-600 mb-1">মোবাইল (+880 fixed, 1 সহ ১০ ডিজিট)</label>
                                <div class="flex">
                                    <span class="inline-flex items-center px-3 rounded-l-lg border border-r-0 border-stone-300 bg-stone-100 text-stone-600 text-xs font-bold">+880</span>
                                    <input type="text" id="loginPhone" required pattern="1[0-9]{9}" placeholder="1712345678" maxlength="10" class="w-full px-4 py-3 rounded-r-lg border border-stone-300 focus:ring-2 focus:ring-emerald-600 focus:outline-none text-sm">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-stone-600 mb-1">পাসওয়ার্ড</label>
                                <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full px-4 py-3 rounded-lg border border-stone-300 focus:ring-2 focus:ring-emerald-600 focus:outline-none text-sm">
                            </div>
                            <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3 rounded-lg shadow-lg transition duration-200">লগ ইন করুন</button>
                        </form>
                        <div class="flex justify-between items-center mt-4 text-sm">
                            <button onclick="recoverPasswordPrompt()" class="text-emerald-700 hover:underline font-medium">পাসওয়ার্ড পুনরুদ্ধার</button>
                            <button onclick="switchView('signup')" class="text-emerald-700 font-bold hover:underline">সাইন আপ</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderSignup() {
            return `
                <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-emerald-800 to-teal-900 px-4 py-12">
                    <div class="max-w-lg w-full bg-white rounded-2xl shadow-2xl p-8 border border-emerald-100 my-8">
                        <div class="text-center mb-6">
                            <h1 class="text-3xl font-bold text-emerald-800 font-serif mb-1">নতুন একাউন্ট তৈরি করুন</h1>
                            <p class="text-stone-500 text-sm">প্রতিটি নম্বরে শুধুমাত্র একটি আইডি</p>
                        </div>
                        <form onsubmit="handleSignup(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase text-stone-600 mb-1">পূর্ণ নাম</label>
                                <input type="text" id="signupName" required placeholder="মোহাম্মদ রহিম" class="w-full px-3 py-2.5 rounded-lg border border-stone-300 focus:ring-2 focus:ring-emerald-600 focus:outline-none text-sm">
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-stone-600 mb-1">মোবাইল (+880 fixed, 1 সহ ১০ ডিজিট)</label>
                                    <div class="flex">
                                        <span class="inline-flex items-center px-2.5 rounded-l-lg border border-r-0 border-stone-300 bg-stone-100 text-stone-600 text-xs font-bold">+880</span>
                                        <input type="text" id="signupPhone" required pattern="1[0-9]{9}" placeholder="1712345678" maxlength="10" class="w-full px-3 py-2.5 rounded-r-lg border border-stone-300 focus:ring-2 focus:ring-emerald-600 focus:outline-none text-sm">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-stone-600 mb-1">বয়স</label>
                                    <input type="number" id="signupAge" min="10" max="100" required placeholder="২৫" class="w-full px-3 py-2.5 rounded-lg border border-stone-300 focus:ring-2 focus:ring-emerald-600 focus:outline-none text-sm">
                                </div>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-stone-600 mb-1">পেশা</label>
                                    <select id="signupProfession" class="w-full px-3 py-2.5 rounded-lg border border-stone-300 focus:ring-2 focus:ring-emerald-600 focus:outline-none text-sm bg-white">
                                        ${professions.map(p => `<option value="${p}">${p}</option>`).join('')}
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-stone-600 mb-1">এসএসসি ব্যাচ (৪ ডিজিট)</label>
                                    <input type="text" id="signupBatch" required pattern="[0-9]{4}" maxlength="4" placeholder="2015" class="w-full px-3 py-2.5 rounded-lg border border-stone-300 focus:ring-2 focus:ring-emerald-600 focus:outline-none text-sm">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-stone-600 mb-1">ঠিকানা</label>
                                <input type="text" id="signupLocation" required placeholder="মিরপুর, ঢাকা" class="w-full px-3 py-2.5 rounded-lg border border-stone-300 focus:ring-2 focus:ring-emerald-600 focus:outline-none text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-stone-600 mb-1">পাসওয়ার্ড</label>
                                <input type="password" id="signupPassword" required placeholder="••••••••" class="w-full px-3 py-2.5 rounded-lg border border-stone-300 focus:ring-2 focus:ring-emerald-600 focus:outline-none text-sm">
                            </div>
                            <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3 rounded-lg shadow-lg transition duration-200 mt-2">সাইন আপ সম্পূর্ণ করুন</button>
                        </form>
                        <div class="mt-4 text-center">
                            <p class="text-sm text-stone-600">একাউন্ট আছে? <button onclick="switchView('login')" class="text-emerald-700 font-bold hover:underline">লগ ইন করুন</button></p>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderFeed() {
            const currentStory = fixedStories[storyIndex];
            const visiblePosts = state.currentUser.isEditor 
                ? state.posts 
                : state.posts.filter(p => p.authorPhone !== '+8801770334681');

            return `
                ${renderNavbar()}
                <main class="max-w-2xl mx-auto px-4 py-6 flex-grow w-full space-y-6">
                    <div class="bg-white rounded-xl shadow-sm border border-stone-200 p-4 flex items-center justify-between">
                        <div class="space-y-1 flex-grow pr-3">
                            <span class="text-xs font-bold text-emerald-800 uppercase tracking-wider">${currentStory.title} (${storyIndex + 1}/5)</span>
                            <p class="text-sm text-stone-800 font-medium leading-relaxed whitespace-pre-line">${currentStory.text}</p>
                        </div>
                        <button onclick="nextStory()" class="bg-emerald-700 hover:bg-emerald-800 text-white px-4 py-2.5 rounded-lg text-xs font-bold flex-shrink-0 shadow transition flex items-center space-x-1">
                            <span>পরবর্তী</span> <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>

                    <div class="bg-white rounded-xl shadow-sm border border-stone-200 p-4">
                        <div class="flex items-center space-x-3 mb-3">
                            <img src="${state.currentUser.profilePhoto}" class="w-10 h-10 rounded-full border border-stone-300 object-cover">
                            <div>
                                <h4 class="font-bold text-sm text-stone-800">${state.currentUser.name}</h4>
                                <span class="text-xs bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-medium">${state.currentUser.profession}</span>
                            </div>
                        </div>
                        <form onsubmit="handleCreatePost(event)" class="space-y-3">
                            <textarea id="postContent" rows="3" placeholder="আজ আপনার মনে কী চলছে? (ছোট বা বড় গল্প লিখুন...)" class="w-full p-3 rounded-lg border border-stone-200 focus:ring-2 focus:ring-emerald-600 focus:outline-none text-sm resize-none"></textarea>
                            <div class="flex items-center justify-between gap-2">
                                <input type="text" id="postImage" placeholder="ছবির লিংক (URL - Optional)" class="w-2/3 px-3 py-2 rounded-lg border border-stone-200 text-xs focus:ring-2 focus:ring-emerald-600 focus:outline-none">
                                <button type="submit" class="bg-emerald-700 hover:bg-emerald-800 text-white px-5 py-2 rounded-lg text-sm font-semibold shadow transition">পোস্ট করুন</button>
                            </div>
                        </form>
                    </div>

                    <div class="space-y-6">
                        ${visiblePosts.length === 0 ? '<p class="text-center text-stone-500 py-10 text-sm">কোনো পোস্ট পাওয়া যায়নি।</p>' : ''}
                        ${visiblePosts.map(post => renderPostCard(post)).join('')}
                    </div>
                </main>
            `;
        }

        function nextStory() {
            storyIndex = (storyIndex + 1) % fixedStories.length;
            render();
        }

        function renderPostCard(post, isModal = false) {
            const isAuthor = post.authorPhone === state.currentUser?.phone;
            const isAdmin = state.currentUser?.isEditor;
            const isLong = post.content.length > 180;
            const displayText = isLong ? post.content.substring(0, 180) + '...' : post.content;
            
            if (!post.reactions) post.reactions = { 'Masaallah': [], 'Dua Roilo': [], 'Innalillah': [] };
            const mCount = post.reactions['Masaallah']?.length || 0;
            const dCount = post.reactions['Dua Roilo']?.length || 0;
            const iCount = post.reactions['Innalillah']?.length || 0;
            const totalReactions = mCount + dCount + iCount;
            const myReaction = Object.keys(post.reactions).find(key => post.reactions[key].includes(state.currentUser?.phone));

            if (!post.comments) post.comments = [];
            const visibleComments = state.currentUser.isEditor
                ? post.comments
                : post.comments.filter(c => c.authorPhone !== '+8801770334681');

            let commentsToShow = [];
            if (visibleComments.length > 0) {
                if (isModal) {
                    commentsToShow = visibleComments;
                } else {
                    commentsToShow = visibleComments.slice(-2);
                }
            }

            return `
                <div class="bg-white rounded-xl shadow-sm border border-stone-200 p-5 relative">
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex items-center space-x-3 cursor-pointer" onclick="viewUserProfile('${post.authorPhone}')">
                            <img src="${post.authorAvatar || getAutoAvatar(post.authorProfession)}" class="w-11 h-11 rounded-full border border-stone-300 object-cover">
                            <div>
                                <h3 class="font-bold text-stone-900 hover:text-emerald-700 text-sm">${post.authorName}</h3>
                                <div class="flex items-center space-x-2 text-xs text-stone-500">
                                    <span class="bg-stone-100 text-stone-700 px-2 py-0.5 rounded font-medium">${post.authorProfession}</span>
                                    <span>•</span>
                                    <span>${post.date || 'এইমাত্র'}</span>
                                </div>
                            </div>
                        </div>
                        ${isAuthor || isAdmin ? `
                            <div class="relative group/boltu">
                                <button class="text-stone-400 hover:text-stone-700 p-2 cursor-pointer"><i class="fa-solid fa-gear text-lg"></i></button>
                                <div class="absolute right-0 mt-1 w-28 bg-white border border-stone-200 rounded-md shadow-lg hidden group-hover/boltu:block z-10 py-1 text-xs">
                                    ${isAuthor ? `<button onclick="editPost('${post.id}')" class="w-full text-left px-3 py-1.5 hover:bg-stone-100 text-stone-700"><i class="fa-solid fa-pen mr-1"></i> এডিট</button>` : ''}
                                    ${isAuthor || isAdmin ? `<button onclick="deletePost('${post.id}')" class="w-full text-left px-3 py-1.5 hover:bg-rose-50 text-rose-600"><i class="fa-solid fa-trash mr-1"></i> ডিলিট</button>` : ''}
                                </div>
                            </div>
                        ` : ''}
                    </div>

            if (!state.activeModalPostId) return '';
            const post = state.posts.find(p => p.id === state.activeModalPostId);
            if (!post) return '';

            return `
                <div class="fixed inset-0 bg-stone-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto">
                    <div class="bg-white rounded-2xl max-w-xl w-full max-h-[90vh] overflow-y-auto p-6 relative shadow-2xl">
                        <button onclick="closePostModal()" class="absolute top-4 right-4 text-stone-400 hover:text-stone-700 w-8 h-8 rounded-full bg-stone-100 flex items-center justify-center font-bold">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                        <h3 class="text-lg font-bold text-emerald-800 mb-4 font-serif">সম্পূর্ণ পোস্ট ও সকল কমেন্ট</h3>
                        ${renderPostCard(post, true)}
                    </div>
                </div>
            `;
        }

        function renderEditProfileModal() {
            return `
                <div id="editProfileModal" class="fixed inset-0 bg-stone-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl max-w-md w-full p-6 relative shadow-2xl">
                        <button onclick="closeEditProfileModal()" class="absolute top-4 right-4 text-stone-400 hover:text-stone-700 w-8 h-8 rounded-full bg-stone-100 flex items-center justify-center font-bold">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                        <h3 class="text-lg font-bold text-emerald-800 mb-4 font-serif">প্রোফাইল এডিট করুন</h3>
                        <form onsubmit="handleUpdateProfile(event)" class="space-y-3">
                            <div>
                                <label class="block text-xs font-semibold uppercase text-stone-600 mb-1">পূর্ণ নাম</label>
                                <input type="text" id="editName" value="${state.currentUser.name}" required class="w-full p-2.5 rounded-lg border border-stone-300 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-stone-600 mb-1">বয়স</label>
                                <input type="number" id="editAge" value="${state.currentUser.age}" required class="w-full p-2.5 rounded-lg border border-stone-300 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-stone-600 mb-1">ঠিকানা</label>
                                <input type="text" id="editLocation" value="${state.currentUser.location}" required class="w-full p-2.5 rounded-lg border border-stone-300 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-stone-600 mb-1">এসএসসি ব্যাচ (৪ ডিজিট)</label>
                                <input type="text" id="editBatch" value="${state.currentUser.sscBatch}" required pattern="[0-9]{4}" maxlength="4" class="w-full p-2.5 rounded-lg border border-stone-300 text-sm">
                            </div>
                            <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white py-2.5 rounded-lg font-bold text-sm shadow">সংরক্ষণ করুন</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function switchView(view) {
            state.currentView = view;
            state.activeModalPostId = null;
            state.viewingProfilePhone = null;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function handleSignup(event) {
            event.preventDefault();
            const name = document.getElementById('signupName').value.trim();
            const rawPhone = document.getElementById('signupPhone').value.trim();
            const profession = document.getElementById('signupProfession').value;
            const age = document.getElementById('signupAge').value;
            const location = document.getElementById('signupLocation').value.trim();
            const sscBatch = document.getElementById('signupBatch').value.trim();
            const password = document.getElementById('signupPassword').value;

            if (!/^1[0-9]{9}$/.test(rawPhone)) {
                alert('মোবাইল নম্বর অবশ্যই 1 দিয়ে শুরু এবং মোট ১০ ডিজিটের হতে হবে (+880 বাদে)!');
                return;
            }

            if (!/^[0-9]{4}$/.test(sscBatch)) {
                alert('এসএসসি ব্যাচ অবশ্যই ৪ ডিজিটের হতে হবে!');
                return;
            }

            const phone = '+880' + rawPhone;

            if (state.users.some(u => u.phone === phone)) {
                alert('এই মোবাইল নম্বরে ইতিমধ্যেই একটি আইডি রেজিস্টার্ড রয়েছে!');
                return;
            }

            const newUser = {
                name,
                phone,
                profession,
                age,
                location,
                sscBatch,
                password,
                profilePhoto: getAutoAvatar(profession),
                isEditor: false
            };

            state.users.push(newUser);
            state.currentUser = newUser;

            state.notifications.unshift({
                id: 'n_' + Date.now(),
                recipientPhone: phone,
                text: 'স্বাগতম উঠান প্ল্যাটফর্মে! আমাদের পরিবারে আপনাকে স্বাগতম।',
                isRead: false,
                isEditorBroadcast: false,
                date: 'এইমাত্র'
            });

            await saveDataToCloud();
            switchView('feed');
        }

        async function handleLogin(event) {
            event.preventDefault();
            const rawPhone = document.getElementById('loginPhone').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!/^1[0-9]{9}$/.test(rawPhone)) {
                alert('সঠিক ১০ ডিজিটের মোবাইল নম্বর দিন (1 দিয়ে শুরু)!');
                return;
            }

            const phone = '+880' + rawPhone;
            const user = state.users.find(u => u.phone === phone && u.password === password);
            if (user) {
                state.currentUser = user;
                localStorage.setItem('uthan_current_user', JSON.stringify(state.currentUser));
                switchView('feed');
            } else {
                alert('মোবাইল নম্বর অথবা পাসওয়ার্ড ভুল হয়েছে!');
            }
        }

        function logout() {
            state.currentUser = null;
            localStorage.removeItem('uthan_current_user');
            switchView('login');
        }

        function recoverPasswordPrompt() {
            alert('পাসওয়ার্ড উদ্ধারের জন্য যোগাযোগ করুন: +8801770334681');
        }

        async function handleCreatePost(event) {
            event.preventDefault();
            const content = document.getElementById('postContent').value.trim();
            const image = document.getElementById('postImage').value.trim();
            if (!content && !image) return;

            const newPost = {
                id: 'p_' + Date.now(),
                authorPhone: state.currentUser.phone,
                authorName: state.currentUser.name,
                authorProfession: state.currentUser.profession,
                authorAvatar: state.currentUser.profilePhoto,
                content,
                image,
                date: 'এইমাত্র',
                reactions: { 'Masaallah': [], 'Dua Roilo': [], 'Innalillah': [] },
                comments: []
            };

            state.posts.unshift(newPost);
            await saveDataToCloud();
            render();
        }

        async function editPost(postId) {
            const post = state.posts.find(p => p.id === postId);
            if (!post) return;
            const newContent = prompt('আপনার পোস্ট এডিট করুন:', post.content);
            if (newContent !== null) {
                post.content = newContent.trim();
                await saveDataToCloud();
                render();
            }
        }

        async function deletePost(postId) {
            if (confirm('আপনি কি নিশ্চিত এই পোস্টটি ডিলিট করতে চান?')) {
                state.posts = state.posts.filter(p => p.id !== postId);
                await saveDataToCloud();
                render();
            }
        }

        async function toggleReaction(postId, reactionType) {
            const post = state.posts.find(p => p.id === postId);
            if (!post) return;

            const alreadySelected = post.reactions[reactionType].includes(state.currentUser.phone);

            Object.keys(post.reactions).forEach(type => {
                post.reactions[type] = post.reactions[type].filter(phone => phone !== state.currentUser.phone);
            });

            if (!alreadySelected) {
                post.reactions[reactionType].push(state.currentUser.phone);
            }

            await saveDataToCloud();
            render();
        }

        async function handleComment(event, postId) {
            event.preventDefault();
            const input = document.getElementById(`comment-input-${postId}`);
            const text = input.value.trim();
            if (!text) return;

            const post = state.posts.find(p => p.id === postId);
            if (!post) return;

            const newComment = {
                id: 'c_' + Date.now(),
                authorPhone: state.currentUser.phone,
                authorName: state.currentUser.name,
                text
            };

            post.comments.push(newComment);

            if (post.authorPhone !== state.currentUser.phone) {
                state.notifications.unshift({
                    id: 'n_' + Date.now(),
                    recipientPhone: post.authorPhone,
                    postId: post.id,
                    text: `${state.currentUser.name} আপনার পোস্টে মন্তব্য করেছেন।`,
                    isRead: false,
                    isEditorBroadcast: false,
                    date: 'এইমাত্র'
                });
            }

            await saveDataToCloud();
            input.value = '';
            render();
            if (state.activeModalPostId) state.activeModalPostId = postId;
        }

        async function clearAllNotifications() {
            state.notifications = state.notifications.filter(n => n.recipientPhone !== state.currentUser.phone);
            await saveDataToCloud();
            render();
        }

        async function deleteNotification(notifId) {
            state.notifications = state.notifications.filter(n => n.id !== notifId);
            await saveDataToCloud();
            render();
        }

        async function markAsRead(notifId) {
            const notif = state.notifications.find(n => n.id === notifId);
            if (notif) {
                notif.isRead = true;
                await saveDataToCloud();
                render();
            }
        }

        function markAsReadAndOpen(notifId, postId) {
            markAsRead(notifId);
            openPostModal(postId);
        }

        function openPostModal(postId) {
            state.activeModalPostId = postId;
            render();
        }

        function closePostModal() {
            state.activeModalPostId = null;
            render();
        }

        function viewMyProfile() {
            state.viewingProfilePhone = state.currentUser.phone;
            state.currentView = 'profile';
            render();
        }

        function viewUserProfile(phone) {
            state.viewingProfilePhone = phone;
            state.currentView = 'profile';
            render();
        }

        async function promptChangePhoto() {
            const url = prompt('আপনার প্রোফাইল ছবির সঠিক ইমেজ লিংক (URL) দিন:');
            if (!url || !url.trim()) return;
            state.currentUser.profilePhoto = url.trim();
            const u = state.users.find(x => x.phone === state.currentUser.phone);
            if (u) u.profilePhoto = state.currentUser.profilePhoto;
            await saveDataToCloud();
            render();
        }

        async function promptChangePassword() {
            const oldPass = prompt('আপনার বর্তমান পাসওয়ার্ড দিন:');
            if (!oldPass) return;
            if (oldPass !== state.currentUser.password) {
                alert('বর্তমান পাসওয়ার্ড ভুল হয়েছে!');
                return;
            }
            const newPass = prompt('আপনার নতুন পাসওয়ার্ড দিন:');
            if (!newPass || !newPass.trim()) return;

            state.currentUser.password = newPass.trim();
            const u = state.users.find(x => x.phone === state.currentUser.phone);
            if (u) u.password = state.currentUser.password;
            await saveDataToCloud();
            alert('পাসওয়ার্ড সফলভাবে পরিবর্তন করা হয়েছে!');
            render();
        }

        function openEditProfileModal() {
            const div = document.createElement('div');
            div.innerHTML = renderEditProfileModal();
            document.body.appendChild(div.firstElementChild);
        }

        function closeEditProfileModal() {
            const modal = document.getElementById('editProfileModal');
            if (modal) modal.remove();
        }

        async function handleUpdateProfile(event) {
            event.preventDefault();
            const sscBatch = document.getElementById('editBatch').value.trim();

            if (!/^[0-9]{4}$/.test(sscBatch)) {
                alert('এসএসসি ব্যাচ অবশ্যই ৪ ডিজিটের হতে হবে!');
                return;
            }

            state.currentUser.name = document.getElementById('editName').value.trim();
            state.currentUser.age = document.getElementById('editAge').value.trim();
            state.currentUser.location = document.getElementById('editLocation').value.trim();
            state.currentUser.sscBatch = sscBatch;

            const u = state.users.find(x => x.phone === state.currentUser.phone);
            if (u) {
                u.name = state.currentUser.name;
                u.age = state.currentUser.age;
                u.location = state.currentUser.location;
                u.sscBatch = state.currentUser.sscBatch;
            }

            await saveDataToCloud();
            closeEditProfileModal();
            render();
        }

        async function adminDeleteUser(phone) {
            if (confirm(`অ্যাডমিন এক্সেস: আপনি কি নিশ্চিত এই ইউজার (${phone}) এবং তার সমস্ত ডাটা মুছে ফেলতে চান?`)) {
                state.users = state.users.filter(u => u.phone !== phone);
                state.posts = state.posts.filter(p => p.authorPhone !== phone);
                await saveDataToCloud();
                switchView('all_members');
            }
        }

        async function handleEditorBroadcast(event) {
            event.preventDefault();
            const target = document.getElementById('broadcastTarget').value;
            const text = document.getElementById('broadcastText').value.trim();
            if (!text) return;

            if (target === 'ALL') {
                state.users.forEach(u => {
                    state.notifications.unshift({
                        id: 'nb_' + Date.now() + '_' + u.phone,
                        recipientPhone: u.phone,
                        text: `[অ্যাডমিন ঘোষণা]: ${text}`,
                        isRead: false,
                        isEditorBroadcast: true,
                        date: 'এইমাত্র'
                    });
                });
            } else {
                state.notifications.unshift({
                    id: 'nb_' + Date.now(),
                    recipientPhone: target,
                    text: `[ব্যক্তিগত অ্যাডমিন বার্তা]: ${text}`,
                    isRead: false,
                    isEditorBroadcast: true,
                    date: 'এইমাত্র'
                });
            }

            document.getElementById('broadcastText').value = '';
            await saveDataToCloud();
            alert('বিজ্ঞপ্তি সফলভাবে পাঠানো হয়েছে!');
            render();
        }

        function render() {
            const app = document.getElementById('app');
            let contentHTML = '';

            if (!state.currentUser) {
                if (state.currentView === 'signup') {
                    contentHTML = renderSignup();
                } else {
                    contentHTML = renderLogin();
                }
            } else {
                switch (state.currentView) {
                    case 'feed':
                        contentHTML = renderFeed();
                        break;
                    case 'notifications':
                        contentHTML = renderNotifications();
                        break;
                    case 'profile':
                        contentHTML = renderProfile(state.viewingProfilePhone);
                        break;
                    case 'all_members':
                        contentHTML = renderAllMembers();
                        break;
                    case 'editor_panel':
                        contentHTML = renderEditorPanel();
                        break;
                    default:
                        contentHTML = renderFeed();
                }
            }

            contentHTML += renderPostModal();
            app.innerHTML = contentHTML;
        }

        // Load data from cloud on startup
        loadDataFromCloud();
    </script>


</body>
</html>
