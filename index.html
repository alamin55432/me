<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uthan - বাংলা সোশ্যাল সাইট (Cloud Live)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-stone-50 text-stone-800 font-sans antialiased min-h-screen pb-12">

    <div id="app" class="min-h-screen flex flex-col"></div>

    <script>
        // TODO: আপনার ফায়ারবেস কনসোল থেকে পাওয়া কনফিগারেশন এখানে বসান
       const firebaseConfig = {
  apiKey: "AIzaSyCwxTRS9qV4E_SKNcDbwZhpAbmt9lzTTB0",
  authDomain: "uthan-app.firebaseapp.com",
  databaseURL: "https://uthan-app-default-rtdb.firebaseio.com",
  projectId: "uthan-app",
  storageBucket: "uthan-app.firebasestorage.app",
  messagingSenderId: "38539464818",
  appId: "1:38539464818:web:8518def23c53c3ec5ff2eb",
  measurementId: "G-WVRJNJBVTY"
};

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();


        // ---------- Helpers (security & UX) ----------
        function esc(v){ return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
        function safeUrl(u){
            u = String(u || '');
            if (u.startsWith('data:image/')) return esc(u);
            try { const x = new URL(u); return (x.protocol === 'https:' || x.protocol === 'http:') ? esc(u) : ''; } catch (e) { return ''; }
        }
        async function hashPw(phone, pw){
            if (!window.crypto || !crypto.subtle) return pw;
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('uthan:' + phone + ':' + pw));
            return 'h1$' + Array.from(new Uint8Array(buf)).map(x => x.toString(16).padStart(2, '0')).join('');
        }
        function timeAgo(ts, fallback){
            if (!ts) return fallback || 'এইমাত্র';
            const s = Math.floor((Date.now() - ts) / 1000), bn = n => n.toLocaleString('bn-BD');
            if (s < 60) return 'এইমাত্র';
            if (s < 3600) return bn(Math.floor(s / 60)) + ' মিনিট আগে';
            if (s < 86400) return bn(Math.floor(s / 3600)) + ' ঘণ্টা আগে';
            if (s < 2592000) return bn(Math.floor(s / 86400)) + ' দিন আগে';
            return new Date(ts).toLocaleDateString('bn-BD', { year: 'numeric', month: 'long', day: 'numeric' });
        }
        function todayStoryText(){
            const d = new Date();
            const en = d.toLocaleDateString('bn-BD', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            let ar = '';
            try { ar = d.toLocaleDateString('bn-BD-u-ca-islamic-umalqura', { year: 'numeric', month: 'long', day: 'numeric' }); } catch (e) {}
            return 'ইংরেজি: ' + en + (ar ? ' | হিজরি: ' + ar : '');
        }
        document.addEventListener('error', e => {
            const t = e.target;
            if (!t || t.tagName !== 'IMG' || t.dataset.fb) return;
            t.dataset.fb = 1;
            if (t.alt === 'Post image') t.parentElement.style.display = 'none'; else t.src = getAutoAvatar();
        }, true);

        const professions = [
            "কৃষক (Farmer)", "ছাত্র (Student)", "শিক্ষক (Teacher)", "প্রকৌশলী (Engineer)", 
            "ডাক্তার (Doctor)", "ব্যবসায়ী (Business)", "প্রবাসী (Expatriate)", "চাকরিজীবী (Service Holder)"
        ];

        function getAutoAvatar() {
            const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><rect width="96" height="96" fill="#d1fae5"/><circle cx="48" cy="38" r="17" fill="#059669"/><path d="M14 96c2-22 18-32 34-32s32 10 34 32z" fill="#059669"/></svg>';
            return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
        }

        let fixedStories = [
            { id: 'st1', title: 'আজকের তারিখ', text: 'ইংরেজি: ১৯ নভেম্বর ২০২৬ | বাংলা: ৪ অগ্রহায়ণ ১৪৩৩ | আরবি: ৮ জমাদিউল উলা ১৪৪৮ হিজরি।' },
            { id: 'st2', title: 'আজকের কুরআন আয়াত', text: '"তোমরা ধৈর্য ও সালাতের মাধ্যমে সাহায্য প্রার্থনা করো।" (সুরা বাকারা: ৪৫)' },
            { id: 'st3', title: 'আজকের হাদিস', text: '"তোমাদের মধ্যে সেই ব্যক্তি উত্তম, যে নিজে কুরআন শেখে এবং অপরকে শেখায়।" (বুখারি)' },
            { id: 'st4', title: 'বাংলার প্রবাদ', text: '"চরে খাওয়া মানুষের মনে অহংকার থাকে না, পরিশ্রমই তাদের বড় পুঁজি।"' },
            { id: 'st5', title: 'সর্বশেষ সংবাদ', text: 'ক্লাউড রিয়েল-টাইম সার্ভার সিঙ্ক সক্রিয় রয়েছে।' }
        ];

        let storyIndex = 0;

        let state = {
            currentUser: null,
            authReady: false,
            adminIds: new Set(),
            signingUp: false,
            postLimit: 15,
            postsMore: false,
            memberQuery: '',
            users: [],
            posts: [],
            notifications: [],
            currentView: 'login',
            activeModalPostId: null,
            viewingProfilePhone: null
        };

        // --- Cloud Firestore (separate collections + per-user Auth) ---
        const synced = { users: {}, posts: {}, notifications: {}, stories: JSON.stringify(fixedStories) };
        const idOf = (col, o) => col === 'users' ? o.uid : o.id;
        const strip = (col, o) => { if (col !== 'users') return o; const { isEditor, email, password, ...r } = o; return r; };
        const byNewest = (a, b) => (b.createdAt || 0) - (a.createdAt || 0);

        // Writes only the documents that changed since the last sync
        async function saveDataToCloud() {
            if (!auth.currentUser) return;
            try {
                const batch = db.batch();
                let n = 0;
                for (const col of ['users', 'posts', 'notifications']) {
                    const cur = {};
                    state[col].forEach(o => { cur[idOf(col, o)] = strip(col, o); });
                    for (const id in cur) {
                        const j = JSON.stringify(cur[id]);
                        if (synced[col][id] !== j) { batch.set(db.collection(col).doc(id), cur[id]); synced[col][id] = j; n++; }
                    }
                    for (const id in synced[col]) {
                        if (!(id in cur)) { batch.delete(db.collection(col).doc(id)); delete synced[col][id]; n++; }
                    }
                }
                const st = JSON.stringify(fixedStories);
                if (state.currentUser && state.currentUser.isEditor && st !== synced.stories) {
                    batch.set(db.collection('config').doc('stories'), { items: fixedStories, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }); synced.stories = st; n++;
                }
                if (n) await batch.commit();
            } catch (error) {
                console.error('Cloud Save Error: ', error);
                alert('সংরক্ষণ করা যায়নি (অনুমতি নেই বা নেটওয়ার্ক সমস্যা)।');
            }
        }

        function applyMe() {
            const au = auth.currentUser;
            if (!au) return false;
            state.users.forEach(u => { u.isEditor = state.adminIds.has(u.uid); });
            const me = state.users.find(u => u.uid === au.uid);
            if (!me) return false;
            const first = !state.currentUser;
            state.currentUser = Object.assign({}, me, { email: au.email });
            if (first) {
                state.authReady = true;
                if (state.currentView === 'login' || state.currentView === 'signup') state.currentView = 'feed';
                startNotifListener(me.phone);
            }
            return true;
        }

        let unsubs = [], notifUnsub = null, postsUnsub = null;
        function stopListeners() {
            unsubs.forEach(u => u()); unsubs = [];
            if (notifUnsub) { notifUnsub(); notifUnsub = null; }
            if (postsUnsub) { postsUnsub(); postsUnsub = null; }
        }
        function startNotifListener(phone) {
            if (notifUnsub) notifUnsub();
            notifUnsub = db.collection('notifications').where('recipientPhone', '==', phone).onSnapshot(snap => {
                state.notifications = snap.docs.map(d => d.data()).sort(byNewest);
                synced.notifications = {};
                state.notifications.forEach(o => { synced.notifications[o.id] = JSON.stringify(o); });
                render();
            }, e => console.error(e));
        }
        // Newest posts first; "load more" raises the limit. No expiry/TTL anywhere: posts stay until the author or an admin deletes them.
        function startPostsListener() {
            if (postsUnsub) postsUnsub();
            postsUnsub = db.collection('posts').orderBy('createdAt', 'desc').limit(state.postLimit).onSnapshot(snap => {
                state.postsMore = snap.docs.length >= state.postLimit;
                state.posts = snap.docs.map(d => d.data());
                synced.posts = {};
                state.posts.forEach(o => { synced.posts[o.id] = JSON.stringify(o); });
                render();
            }, e => console.error(e));
        }
        function loadMorePosts() { state.postLimit += 15; startPostsListener(); }

        // ---- Story cards: refreshed from the internet every 6 hours ----
        const STORY_TTL = 6 * 3600 * 1000;
        let storiesUpdatedAt = 0, storyBusy = false, storyLastTry = 0;
        const PROVERBS = [
            'অতি লোভে তাঁতি নষ্ট।', 'এক হাতে তালি বাজে না।', 'নাচতে না জানলে উঠান বাঁকা।', 'সবুরে মেওয়া ফলে।',
            'যত গর্জে তত বর্ষে না।', 'ঘরের শত্রু বিভীষণ।', 'অতি দর্পে হত লঙ্কা।', 'শাক দিয়ে মাছ ঢাকা যায় না।',
            'যতক্ষণ শ্বাস ততক্ষণ আশ।', 'সময়ের এক ফোঁড়, অসময়ের দশ ফোঁড়।', 'দশের লাঠি একের বোঝা।', 'ডুবে ডুবে জল খাওয়া।',
            'কয়লা ধুলেও ময়লা যায় না।', 'আপনা মাংসে হরিণা বৈরী।', 'অভাবে স্বভাব নষ্ট।', 'তেলা মাথায় তেল দেওয়া।'
        ];
        async function fetchJson(url, ms = 9000) {
            const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
            try { const r = await fetch(url, { signal: c.signal }); if (!r.ok) throw new Error(r.status); return await r.json(); }
            finally { clearTimeout(t); }
        }
        const clip = (t, n) => { t = String(t || '').replace(/\s+/g, ' ').trim(); return t.length > n ? t.slice(0, n - 1) + '…' : t; };
        const bnNum = n => Number(n).toLocaleString('bn-BD');

        async function buildFreshStories() {
            const slot = Math.floor(Date.now() / STORY_TTL);
            const next = fixedStories.map(x => ({ ...x })), ok = [];
            const set = (i, id, title, text) => { next[i] = { id, title, text }; ok.push(id); };
            await Promise.all([
                (async () => { // Quran ayah (Bengali translation)
                    const n = (slot * 37) % 6236 + 1;
                    const a = (await fetchJson('https://api.alquran.cloud/v1/ayah/' + n + '/bn.bengali')).data;
                    set(1, 'st2', 'আজকের কুরআন আয়াত', '"' + clip(a.text, 320) + '" (সূরা নং ' + bnNum(a.surah.number) + ', আয়াত ' + bnNum(a.numberInSurah) + ')');
                })().catch(() => {}),
                (async () => { // Hadith (Bengali edition)
                    for (const [ed, max, name] of [['ben-bukhari', 4000, 'বুখারি'], ['ben-abudawud', 4000, 'আবু দাউদ']]) {
                        try {
                            const n = (slot * 53) % max + 1;
                            const h = await fetchJson('https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/' + ed + '/' + n + '.json');
                            const t = h.text || (h.hadiths && h.hadiths[0] && h.hadiths[0].text);
                            if (t) { set(2, 'st3', 'আজকের হাদিস', '"' + clip(t, 320) + '" (' + name + ', হাদিস ' + bnNum(n) + ')'); return; }
                        } catch (e) {}
                    }
                })(),
                (async () => { // Latest news (BBC Bangla headlines)
                    const f = await fetchJson('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent('https://feeds.bbci.co.uk/bengali/rss.xml'));
                    const lines = (f.items || []).slice(0, 3).map(i => '• ' + clip(i.title, 110));
                    if (lines.length) set(4, 'st5', 'সর্বশেষ সংবাদ', lines.join('\n') + '\nসূত্র: বিবিসি বাংলা');
                })().catch(() => {})
            ]);
            // Proverb: no free Bangla proverb API exists, so it rotates through a built-in list
            set(3, 'st4', 'বাংলার প্রবাদ', '"' + PROVERBS[slot % PROVERBS.length] + '"');
            return { next, fetched: ok.length - 1 };
        }

        async function maybeRefreshStories(force = false) {
            if (!auth.currentUser || storyBusy) return false;
            if (!force && (Date.now() - storiesUpdatedAt < STORY_TTL + 60000 || Date.now() - storyLastTry < 15 * 60000)) return false;
            storyBusy = true; storyLastTry = Date.now();
            try {
                const { next, fetched } = await buildFreshStories();
                if (fetched < 1) return false; // internet sources unreachable: keep current cards
                await db.collection('config').doc('stories').set({ items: next, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
                return true;
            } catch (e) { return false; } // e.g. another user refreshed first (rules allow one refresh per 6 hours)
            finally { storyBusy = false; }
        }
        setInterval(() => maybeRefreshStories(), 10 * 60 * 1000);

        function startListeners() {
            const err = e => console.error(e);
            unsubs.push(db.collection('admins').onSnapshot(snap => {
                state.adminIds = new Set(snap.docs.map(d => d.id)); applyMe(); render();
            }, err));
            unsubs.push(db.collection('users').onSnapshot(snap => {
                state.users = snap.docs.map(d => d.data());
                synced.users = {};
                state.users.forEach(o => { synced.users[o.uid] = JSON.stringify(strip('users', o)); });
                if (!applyMe() && !state.signingUp && !snap.metadata.fromCache && !snap.metadata.hasPendingWrites) { auth.signOut(); return; }
                render();
            }, err));
            startPostsListener();
            unsubs.push(db.collection('config').doc('stories').onSnapshot(d => {
                if (d.exists && d.data().items) {
                    fixedStories = d.data().items; synced.stories = JSON.stringify(fixedStories);
                    const ts = d.data().updatedAt;
                    storiesUpdatedAt = ts ? ts.toMillis() : Date.now();
                } else { storiesUpdatedAt = 0; }
                render();
                maybeRefreshStories();
            }, err));
        }

        auth.onAuthStateChanged(user => {
            stopListeners();
            if (!user) {
                state.currentUser = null; state.notifications = []; state.authReady = true;
                if (state.currentView !== 'signup') state.currentView = 'login';
                render();
                return;
            }
            startListeners();
        });

        function renderNavbar() {
            if (!state.currentUser) return '';
            const unreadCount = state.notifications.filter(n => n.recipientPhone === state.currentUser.phone && !n.isRead).length;

            return `
                <header class="bg-emerald-800 text-white shadow-md sticky top-0 z-50">
                    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
                        <div class="cursor-pointer" onclick="switchView('feed')">
                            <span class="text-2xl font-bold tracking-wider font-serif">উঠান</span>
                        </div>
                        <div class="flex items-center space-x-6 text-sm font-medium">
                            <button onclick="switchView('feed')" class="transition flex items-center space-x-1 py-1 ${state.currentView === 'feed' ? 'border-b-2 border-white font-bold' : 'hover:text-emerald-200'}">
                                <i class="fa-solid fa-newspaper text-lg"></i> <span class="hidden sm:inline">ফিড</span>
                            </button>
                            <button onclick="switchView('notifications')" class="transition relative flex items-center space-x-1 py-1 ${state.currentView === 'notifications' ? 'border-b-2 border-white font-bold' : 'hover:text-emerald-200'}">
                                <i class="fa-solid fa-bell text-lg"></i> <span class="hidden sm:inline">বিজ্ঞপ্তি</span>
                                ${unreadCount > 0 ? `<span class="absolute -top-1 -right-2 bg-rose-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">${unreadCount}</span>` : ''}
                            </button>
                            <div class="relative">
                                <button onclick="toggleSubmenu(event)" class="flex items-center space-x-2 focus:outline-none py-1">
                                    <img src="${safeUrl(state.currentUser.profilePhoto)}" alt="Profile" class="w-9 h-9 rounded-full border-2 border-emerald-300 object-cover bg-white">
                                    <i class="fa-solid fa-angle-down text-xs"></i>
                                </button>
                                <div id="navSubmenu" class="absolute right-0 mt-2 w-48 bg-white text-stone-800 rounded-lg shadow-2xl py-2 hidden border border-stone-200 z-50">
                                    <button onclick="viewMyProfile()" class="w-full text-left px-4 py-2 hover:bg-emerald-50 hover:text-emerald-700 flex items-center space-x-2">
                                        <i class="fa-solid fa-user text-emerald-600 w-5"></i> <span>প্রোফাইল</span>
                                    </button>
                                    <button onclick="switchView('all_members')" class="w-full text-left px-4 py-2 hover:bg-emerald-50 hover:text-emerald-700 flex items-center space-x-2">
                                        <i class="fa-solid fa-users text-emerald-600 w-5"></i> <span>সকল সদস্য</span>
                                    </button>
                                    ${state.currentUser.isEditor ? `
                                        <button onclick="switchView('editor_panel')" class="w-full text-left px-4 py-2 hover:bg-amber-50 hover:text-amber-700 flex items-center space-x-2 border-t border-stone-100">
                                            <i class="fa-solid fa-shield-halved text-amber-600 w-5"></i> <span>অ্যাডমিন প্যানেল</span>
                                        </button>
                                    ` : ''}
                                    <div class="border-t border-stone-100 my-1"></div>
                                    <button onclick="logout()" class="w-full text-left px-4 py-2 hover:bg-rose-50 hover:text-rose-600 flex items-center space-x-2">
                                        <i class="fa-solid fa-right-from-bracket text-rose-500 w-5"></i> <span>লগ আউট</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </header>
            `;
        }

        function toggleSubmenu(e) {
            e.stopPropagation();
            const menu = document.getElementById('navSubmenu');
            if (menu) menu.classList.toggle('hidden');
        }

        window.addEventListener('click', () => {
            const menu = document.getElementById('navSubmenu');
            if (menu && !menu.classList.contains('hidden')) menu.classList.add('hidden');
        });

        function renderLogin() {
            return `
                <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-emerald-800 to-teal-900 px-4 py-12">
                    <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 border border-emerald-100">
                        <div class="text-center mb-8">
                            <h1 class="text-4xl font-bold text-emerald-800 font-serif mb-2">উঠান</h1>
                            <p class="text-stone-500 text-sm">বাংলা সোশ্যাল সাইট</p>
                        </div>
                        <form onsubmit="handleLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase text-stone-600 mb-1">মোবাইল (+880 fixed, 1 সহ ১০ ডিজিট)</label>
                                <div class="flex">
                                    <span class="inline-flex items-center px-3 rounded-l-lg border border-r-0 border-stone-300 bg-stone-100 text-stone-600 text-xs font-bold">+880</span>
                                    <input type="text" id="loginPhone" required pattern="1[0-9]{9}" placeholder="1712345678" maxlength="10" class="w-full px-4 py-3 rounded-r-lg border border-stone-300 focus:ring-2 focus:ring-emerald-600 focus:outline-none text-sm">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-stone-600 mb-1">পাসওয়ার্ড</label>
                                <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full px-4 py-3 rounded-lg border border-stone-300 focus:ring-2 focus:ring-emerald-600 focus:outline-none text-sm">
                            </div>
                            <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3 rounded-lg shadow-lg transition duration-200">লগ ইন করুন</button>
                        </form>

        function renderFeed() {
            const currentStory = fixedStories[storyIndex].id === 'st1' ? { ...fixedStories[storyIndex], text: todayStoryText() } : fixedStories[storyIndex];
            const visiblePosts = state.currentUser.isEditor 
                ? state.posts 
                : state.posts.filter(p => p.authorPhone !== '+8801770334681');

            return `
                ${renderNavbar()}

                        ${visiblePosts.map(post => renderPostCard(post)).join('')}
                        ${state.postsMore ? '<button onclick="loadMorePosts()" class="w-full py-3 rounded-xl bg-white border border-stone-200 text-emerald-800 text-sm font-bold hover:bg-emerald-50 transition">আরও পোস্ট দেখুন</button>' : ''}

        function nextStory() {
            storyIndex = (storyIndex + 1) % fixedStories.length;
            render();
        }

        function renderPostCard(post, isModal = false) {
            const isAuthor = post.authorPhone === state.currentUser?.phone;
            const isAdmin = state.currentUser?.isEditor;
            const isLong = post.content.length > 180;
            const displayText = isLong ? post.content.substring(0, 180) + '...' : post.content;
            
            if (!post.reactions) post.reactions = { 'Masaallah': [], 'Dua Roilo': [], 'Innalillah': [] };
            const mCount = post.reactions['Masaallah']?.length || 0;
            const dCount = post.reactions['Dua Roilo']?.length || 0;
            const iCount = post.reactions['Innalillah']?.length || 0;
            const totalReactions = mCount + dCount + iCount;
            const myReaction = Object.keys(post.reactions).find(key => post.reactions[key].includes(state.currentUser?.phone));

            if (!post.comments) post.comments = [];
            const visibleComments = state.currentUser.isEditor
                ? post.comments
                : post.comments.filter(c => c.authorPhone !== '+8801770334681');

            let commentsToShow = [];
            if (visibleComments.length > 0) {
                if (isModal) {
                    commentsToShow = visibleComments;
                } else {
                    commentsToShow = visibleComments.slice(-2);
                }
            }

            return `
                <div class="bg-white rounded-xl shadow-sm border border-stone-200 p-5 relative">
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex items-center space-x-3 cursor-pointer" onclick="viewUserProfile('${post.authorPhone}')">

                                <h3 class="font-bold text-stone-900 hover:text-emerald-700 text-sm">${esc(post.authorName)}</h3>
                                <div class="flex items-center space-x-2 text-xs text-stone-500">
                                    <span class="bg-stone-100 text-stone-700 px-2 py-0.5 rounded font-medium">${esc(post.authorProfession)}</span>
                                    <span>•</span>
                                    <span>${timeAgo(post.createdAt, post.date)}</span>
                                </div>
                            </div>
                        </div>
                        ${isAuthor || isAdmin ? `
                            <div class="relative group/boltu">
                                <button class="text-stone-400 hover:text-stone-700 p-2 cursor-pointer"><i class="fa-solid fa-gear text-lg"></i></button>
                                <div class="absolute right-0 mt-1 w-28 bg-white border border-stone-200 rounded-md shadow-lg hidden group-hover/boltu:block z-10 py-1 text-xs">
                                    ${isAuthor ? `<button onclick="editPost('${post.id}')" class="w-full text-left px-3 py-1.5 hover:bg-stone-100 text-stone-700"><i class="fa-solid fa-pen mr-1"></i> এডিট</button>` : ''}
                                    ${isAuthor || isAdmin ? `<button onclick="deletePost('${post.id}')" class="w-full text-left px-3 py-1.5 hover:bg-rose-50 text-rose-600"><i class="fa-solid fa-trash mr-1"></i> ডিলিট</button>` : ''}
                                </div>
                            </div>
                        ` : ''}
                    </div>

                    <div class="text-stone-800 text-sm leading-relaxed mb-4 whitespace-pre-line">
                        <span>${esc(isModal ? post.content : displayText)}</span>
                        ${isLong && !isModal ? `<button onclick="openPostModal('${post.id}')" class="text-emerald-700 font-bold ml-1 hover:underline focus:outline-none text-xs">বিস্তারিত...</button>` : ''}
                    </div>

                    ${post.image ? `
                        <div class="mb-4 rounded-lg overflow-hidden border border-stone-200 bg-stone-100 max-h-80 flex items-center justify-center">
                            <img src="${safeUrl(post.image)}" alt="Post image" class="w-full object-cover max-h-80">
                        </div>
                    ` : ''}

                    <div class="flex items-center justify-between text-xs text-stone-500 border-b border-stone-100 pb-2 mb-3">
                        <div>
                            ${totalReactions > 0 ? `<span class="font-semibold text-emerald-800">🤲 ${totalReactions}টি প্রতিক্রিয়া</span>` : '<span>কোনো প্রতিক্রিয়া নেই</span>'}
                        </div>
                        <div class="space-x-2">
                            ${mCount > 0 ? `<span>মাশাআল্লাহ (${mCount})</span>` : ''}
                            ${dCount > 0 ? `<span>দোয়া রইলো (${dCount})</span>` : ''}
                            ${iCount > 0 ? `<span>ইন্নালিল্লাহ (${iCount})</span>` : ''}
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-2 border-b border-stone-100 pb-3 mb-3">
                        <button onclick="toggleReaction('${post.id}', 'Masaallah')" class="py-1.5 px-2 rounded-lg text-xs font-semibold flex items-center justify-center space-x-1.5 transition ${myReaction === 'Masaallah' ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' : 'bg-stone-100 text-stone-700 hover:bg-stone-200'}">
                            <span>🌿</span> <span>মাশাআল্লাহ</span>
                        </button>
                        <button onclick="toggleReaction('${post.id}', 'Dua Roilo')" class="py-1.5 px-2 rounded-lg text-xs font-semibold flex items-center justify-center space-x-1.5 transition ${myReaction === 'Dua Roilo' ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' : 'bg-stone-100 text-stone-700 hover:bg-stone-200'}">
                            <span>🤲</span> <span>দোয়া রইলো</span>
                        </button>
                        <button onclick="toggleReaction('${post.id}', 'Innalillah')" class="py-1.5 px-2 rounded-lg text-xs font-semibold flex items-center justify-center space-x-1.5 transition ${myReaction === 'Innalillah' ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' : 'bg-stone-100 text-stone-700 hover:bg-stone-200'}">

                                </button>
                            </div>

                    </div>
                </div>

                        ${userNotifs.map(n => `

            const isOwnProfile = user.phone === state.currentUser.phone;

                        <h2 class="text-2xl font-bold text-stone-900 font-serif">${esc(user.name)}</h2>

                            <div>
                                <span class="block text-[10px] text-stone-400 uppercase font-semibold">এসএসসি ব্যাচ</span>
                                <span class="font-bold text-stone-800">${esc(user.sscBatch)}</span>

                            <div>
                                <span class="block text-[10px] text-stone-400 uppercase font-semibold">পোস্ট সংখ্যা</span>
                                <span class="font-bold text-stone-800">${userPosts.length}টি</span>

                        ${isOwnProfile ? `
                            <div class="mt-6 pt-4 border-t border-stone-100 flex flex-wrap justify-center gap-2">

        function switchView(view) {

            render();

        }

        async function handleSignup(event) {
            event.preventDefault();
            const name = document.getElementById('signupName').value.trim();
            const rawPhone = document.getElementById('signupPhone').value.trim();
            const profession = document.getElementById('signupProfession').value;
            const age = document.getElementById('signupAge').value;
            const location = document.getElementById('signupLocation').value.trim();
            const sscBatch = document.getElementById('signupBatch').value.trim();
            const password = document.getElementById('signupPassword').value;
            const email = document.getElementById('signupEmail').value.trim().toLowerCase();

            if (!/^1[0-9]{9}$/.test(rawPhone)) { alert('মোবাইল নম্বর অবশ্যই 1 দিয়ে শুরু এবং মোট ১০ ডিজিটের হতে হবে (+880 বাদে)!'); return; }
            if (!/^[0-9]{4}$/.test(sscBatch)) { alert('এসএসসি ব্যাচ অবশ্যই ৪ ডিজিটের হতে হবে!'); return; }

            const phone = '+880' + rawPhone;
            state.signingUp = true;
            let cred;
            try {
                cred = await auth.createUserWithEmailAndPassword(email, password);
            } catch (e) {
                state.signingUp = false;
                const m = { 'auth/email-already-in-use': 'এই ইমেইল ইতিমধ্যে ব্যবহৃত হয়েছে!', 'auth/invalid-email': 'ইমেইল সঠিক নয়!', 'auth/weak-password': 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের দিন!' };
                alert(m[e.code] || 'একাউন্ট তৈরি করা যায়নি, আবার চেষ্টা করুন।');
                return;
            }
            const uid = cred.user.uid;
            cred.user.sendEmailVerification().catch(() => {});
            const newUser = { uid, name, phone, profession, age, location, sscBatch, profilePhoto: getAutoAvatar() };
            try {
                const b = db.batch();
                b.set(db.collection('phones').doc('880' + rawPhone), { uid, email });
                b.set(db.collection('users').doc(uid), newUser);
                await b.commit();
            } catch (e) {
                await cred.user.delete().catch(() => {});
                state.signingUp = false;
                alert('এই মোবাইল নম্বরে ইতিমধ্যেই একটি আইডি রেজিস্টার্ড রয়েছে!');
                return;
            }
            const nid = 'n_' + Date.now();
            await db.collection('notifications').doc(nid).set({
                id: nid, recipientPhone: phone, text: 'স্বাগতম উঠান প্ল্যাটফর্মে! আমাদের পরিবারে আপনাকে স্বাগতম।',
                isRead: false, isEditorBroadcast: false, date: 'এইমাত্র', createdAt: Date.now()
            }).catch(() => {});
            state.signingUp = false;
        }

        async function lookupEmail(rawPhone) {
            try {
                const d = await db.collection('phones').doc('880' + rawPhone).get();
                return d.exists ? d.data().email : null;
            } catch (e) { return null; }
        }

        async function handleLogin(event) {
            event.preventDefault();
            const rawPhone = document.getElementById('loginPhone').value.trim();
            const password = document.getElementById('loginPassword').value;
            if (!/^1[0-9]{9}$/.test(rawPhone)) { alert('সঠিক ১০ ডিজিটের মোবাইল নম্বর দিন (1 দিয়ে শুরু)!'); return; }
            const email = await lookupEmail(rawPhone);
            try {
                if (!email) throw new Error('no-user');
                await auth.signInWithEmailAndPassword(email, password);
            } catch (e) {
                alert('মোবাইল নম্বর অথবা পাসওয়ার্ড ভুল হয়েছে!');
            }
        }

        function logout() {
            stopListeners();
            auth.signOut().catch(() => {});
            state.currentUser = null;
            localStorage.removeItem('uthan_current_user');
            switchView('login');
        }

        async function recoverPasswordPrompt() {
            const raw = (prompt('আপনার মোবাইল নম্বর দিন (+880 ছাড়া, 1 দিয়ে শুরু ১০ ডিজিট):') || '').trim();
            if (!raw) return;
            if (!/^1[0-9]{9}$/.test(raw)) { alert('সঠিক ১০ ডিজিটের নম্বর দিন!'); return; }
            const email = await lookupEmail(raw);
            if (email) { try { await auth.sendPasswordResetEmail(email); } catch (e) { console.error(e); } }
            alert('যদি এই নম্বরের একাউন্ট থাকে, তাহলে পাসওয়ার্ড রিসেট লিংক ইমেইলে পাঠানো হয়েছে। ইনবক্স ও স্পাম ফোল্ডার দেখুন।');
        }

        async function handleCreatePost(event) {
            event.preventDefault();
            const content = document.getElementById('postContent').value.trim();
            const image = document.getElementById('postImage').value.trim();
            if (!content && !image) return;

            const newPost = {
                id: 'p_' + Date.now(),
                authorPhone: state.currentUser.phone,
                authorName: state.currentUser.name,
                authorProfession: state.currentUser.profession,
                authorAvatar: state.currentUser.profilePhoto,
                content,
                image,
                date: 'এইমাত্র', createdAt: Date.now(),
                reactions: { 'Masaallah': [], 'Dua Roilo': [], 'Innalillah': [] },
                comments: []
            };

            state.posts.unshift(newPost);
            document.getElementById('postContent').value = '';
            document.getElementById('postImage').value = '';
            await saveDataToCloud();
            render();
        }

        async function editPost(postId) {
            const post = state.posts.find(p => p.id === postId);
            if (!post) return;
            const newContent = prompt('আপনার পোস্ট এডিট করুন:', post.content);
            if (newContent !== null) {
                post.content = newContent.trim();
                await saveDataToCloud();
                render();
            }
        }

        async function deletePost(postId) {
            if (confirm('আপনি কি নিশ্চিত এই পোস্টটি ডিলিট করতে চান?')) {
                state.posts = state.posts.filter(p => p.id !== postId);
                await saveDataToCloud();
                render();
            }
        }

        async function toggleReaction(postId, reactionType) {
            const post = state.posts.find(p => p.id === postId);
            if (!post) return;

            const alreadySelected = post.reactions[reactionType].includes(state.currentUser.phone);

            Object.keys(post.reactions).forEach(type => {
                post.reactions[type] = post.reactions[type].filter(phone => phone !== state.currentUser.phone);
            });

            if (!alreadySelected) {
                post.reactions[reactionType].push(state.currentUser.phone);
            }

            await saveDataToCloud();
            render();
        }

        async function handleComment(event, postId) {
            event.preventDefault();
            const input = document.getElementById(`comment-input-${postId}`);
            const text = input.value.trim();
            if (!text) return;

            const post = state.posts.find(p => p.id === postId);
            if (!post) return;

            const newComment = {
                id: 'c_' + Date.now(),
                authorPhone: state.currentUser.phone,
                authorName: state.currentUser.name,
                text
            };

            post.comments.push(newComment);

            if (post.authorPhone !== state.currentUser.phone) {
                state.notifications.unshift({
                    id: 'n_' + Date.now(),
                    recipientPhone: post.authorPhone,
                    postId: post.id,
                    text: `${state.currentUser.name} আপনার পোস্টে মন্তব্য করেছেন।`,
                    isRead: false,
                    isEditorBroadcast: false,
                    date: 'এইমাত্র', createdAt: Date.now()
                });
            }

            await saveDataToCloud();
            input.value = '';
            render();
            if (state.activeModalPostId) state.activeModalPostId = postId;
        }

        async function deleteComment(postId, commentId) {
            const post = state.posts.find(p => p.id === postId);
            if (!post || !confirm('মন্তব্যটি মুছে ফেলবেন?')) return;
            post.comments = (post.comments || []).filter(c => c.id !== commentId);
            await saveDataToCloud();
            render();
        }

        async function clearAllNotifications() {
            state.notifications = state.notifications.filter(n => n.recipientPhone !== state.currentUser.phone);
            await saveDataToCloud();
            render();
        }

        async function deleteNotification(notifId) {
            state.notifications = state.notifications.filter(n => n.id !== notifId);
            await saveDataToCloud();
            render();
        }

        async function markAsRead(notifId) {
            const notif = state.notifications.find(n => n.id === notifId);
            if (notif) {
                notif.isRead = true;
                await saveDataToCloud();
                render();
            }
        }

        function markAsReadAndOpen(notifId, postId) {
            markAsRead(notifId);
            openPostModal(postId);
        }

        function openPostModal(postId) {
            state.activeModalPostId = postId;
            render();
        }

        function closePostModal() {
            state.activeModalPostId = null;
            render();
        }

        function viewMyProfile() {
            state.viewingProfilePhone = state.currentUser.phone;
            state.currentView = 'profile';
            render();
        }

        function viewUserProfile(phone) {
            state.viewingProfilePhone = phone;
            state.currentView = 'profile';
            render();
        }

        async function promptChangePhoto() {
            const url = prompt('আপনার প্রোফাইল ছবির সঠিক ইমেজ লিংক (URL) দিন:');
            if (!url || !url.trim()) return;
            state.currentUser.profilePhoto = url.trim();
            const u = state.users.find(x => x.phone === state.currentUser.phone);
            if (u) u.profilePhoto = state.currentUser.profilePhoto;
            await saveDataToCloud();
            render();
        }

        async function promptChangePassword() {
            const cur = prompt('আপনার বর্তমান পাসওয়ার্ড দিন:');
            if (!cur) return;
            try { await auth.signInWithEmailAndPassword(auth.currentUser.email, cur); } catch (e) { alert('বর্তমান পাসওয়ার্ড ভুল হয়েছে!'); return; }
            const np = (prompt('নতুন পাসওয়ার্ড দিন (কমপক্ষে ৬ অক্ষর):') || '').trim();
            if (np.length < 6) { if (np) alert('পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে!'); return; }
            try { await auth.currentUser.updatePassword(np); alert('পাসওয়ার্ড সফলভাবে পরিবর্তন করা হয়েছে!'); } catch (e) { alert('পাসওয়ার্ড পরিবর্তন করা যায়নি, আবার চেষ্টা করুন।'); }
        }

        function openEditProfileModal() {
            const div = document.createElement('div');
            div.innerHTML = renderEditProfileModal();
            document.body.appendChild(div.firstElementChild);
        }

        function closeEditProfileModal() {
            const modal = document.getElementById('editProfileModal');
            if (modal) modal.remove();
        }

        async function handleUpdateProfile(event) {
            event.preventDefault();
            const sscBatch = document.getElementById('editBatch').value.trim();

            if (!/^[0-9]{4}$/.test(sscBatch)) {
                alert('এসএসসি ব্যাচ অবশ্যই ৪ ডিজিটের হতে হবে!');
                return;
            }

            state.currentUser.name = document.getElementById('editName').value.trim();
            state.currentUser.age = document.getElementById('editAge').value.trim();
            state.currentUser.location = document.getElementById('editLocation').value.trim();
            state.currentUser.sscBatch = sscBatch;

            const u = state.users.find(x => x.phone === state.currentUser.phone);
            if (u) {
                u.name = state.currentUser.name;
                u.age = state.currentUser.age;
                u.location = state.currentUser.location;
                u.sscBatch = state.currentUser.sscBatch;
            }

            await saveDataToCloud();
            closeEditProfileModal();
            render();
        }

        async function adminDeleteUser(phone) {
            if (confirm(`অ্যাডমিন এক্সেস: আপনি কি নিশ্চিত এই ইউজার (${phone}) এবং তার সমস্ত ডাটা মুছে ফেলতে চান?`)) {
                db.collection('phones').doc(phone.replace('+', '')).delete().catch(() => {});
                state.users = state.users.filter(u => u.phone !== phone);
                state.posts = state.posts.filter(p => p.authorPhone !== phone);
                await saveDataToCloud();
                switchView('all_members');
            }
        }

        async function handleEditorBroadcast(event) {
            event.preventDefault();
            const target = document.getElementById('broadcastTarget').value;
            const text = document.getElementById('broadcastText').value.trim();
            if (!text) return;

            if (target === 'ALL') {
                state.users.forEach(u => {
                    state.notifications.unshift({
                        id: 'nb_' + Date.now() + '_' + u.phone,
                        recipientPhone: u.phone,
                        text: `[অ্যাডমিন ঘোষণা]: ${text}`,
                        isRead: false,
                        isEditorBroadcast: true,
                        date: 'এইমাত্র', createdAt: Date.now()
                    });
                });
            } else {
                state.notifications.unshift({
                    id: 'nb_' + Date.now(),
                    recipientPhone: target,
                    text: `[ব্যক্তিগত অ্যাডমিন বার্তা]: ${text}`,
                    isRead: false,
                    isEditorBroadcast: true,
                    date: 'এইমাত্র', createdAt: Date.now()
                });
            }

            document.getElementById('broadcastText').value = '';
            await saveDataToCloud();
            alert('বিজ্ঞপ্তি সফলভাবে পাঠানো হয়েছে!');
            render();
        }

        function render() {
            const app = document.getElementById('app');
            if (!state.authReady) { app.innerHTML = '<div class="min-h-screen flex items-center justify-center text-stone-500 text-sm">লোড হচ্ছে...</div>'; return; }
            let contentHTML = '';

            if (!state.currentUser) {
                if (state.currentView === 'signup') {
                    contentHTML = renderSignup();
                } else {
                    contentHTML = renderLogin();
                }
            } else {
                switch (state.currentView) {
                    case 'feed':
                        contentHTML = renderFeed();
                        break;
                    case 'notifications':
                        contentHTML = renderNotifications();
                        break;
                    case 'profile':
                        contentHTML = renderProfile(state.viewingProfilePhone);
                        break;
                    case 'all_members':
                        contentHTML = renderAllMembers();
                        break;
                    case 'editor_panel':
                        contentHTML = renderEditorPanel();
                        break;
                    default:
                        contentHTML = renderFeed();
                }
            }

            contentHTML += renderPostModal();
            // Keep what the user is typing when a live update re-renders the page
            const saved = {};
            app.querySelectorAll('#postContent, #postImage, [id^="comment-input-"]').forEach(el => { if (el.value) saved[el.id] = el.value; });
            const a = document.activeElement;
            const focusId = a && app.contains(a) ? a.id : null;
            const pos = a ? a.selectionStart : null;
            app.innerHTML = contentHTML;
            Object.keys(saved).forEach(id => { const el = document.getElementById(id); if (el && !el.value) el.value = saved[id]; });
            if (focusId) {
                const el = document.getElementById(focusId);
                if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} }
            }
        }


    </script>


</body>
</html>
